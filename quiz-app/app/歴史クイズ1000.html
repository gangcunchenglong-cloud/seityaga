<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>歴史クイズ1000 ｜ 難関中学受験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;
  --paper:#fbfaf7;
  --ink:#1c2430;
  --ink-soft:#5a6472;
  --navy:#1a3c6e;
  --navy-deep:#122a4d;
  --gold:#b8892b;
  --gold-soft:#e8c874;
  --line:#e4e1d8;
  --line-soft:#efedE7;
  --good:#1e7a4c;
  --good-bg:#eef8f2;
  --bad:#c23b3b;
  --bad-bg:#fdeeee;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,36,48,.06), 0 1px 2px rgba(28,36,48,.04);
  --shadow-lg:0 10px 30px rgba(18,42,77,.10), 0 2px 8px rgba(18,42,77,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--white);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}

/* ---------- Header ---------- */
.site-header{background:var(--white);border-bottom:2px solid var(--navy);position:sticky;top:0;z-index:20;}
.header-inner{max-width:1060px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand-mark{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(155deg,var(--navy),var(--navy-deep));
  color:var(--gold-soft);font-family:"Noto Serif JP",serif;font-weight:900;font-size:21px;
  display:flex;align-items:center;justify-content:center;
}
.brand-text h1{font-family:"Noto Serif JP",serif;font-size:18px;margin:0;color:var(--navy-deep);line-height:1.2;font-weight:900;}
.brand-1000{color:var(--gold);margin-left:3px;}
.brand-text p{margin:2px 0 0;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;}

.tabs{display:flex;gap:4px;}
.tab{
  border:none;background:transparent;color:var(--ink-soft);
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{background:var(--paper);color:var(--navy-deep);}
.tab.active{background:var(--navy);color:#fff;}
.tab-badge{
  background:var(--bad);color:#fff;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;display:inline-flex;
  align-items:center;justify-content:center;padding:0 5px;
}
.tab-badge.zero{background:#c9ccd1;}
.tab.active .tab-badge{background:var(--gold-soft);color:var(--navy-deep);}
a.tab{text-decoration:none;}
@media (max-width:430px){ .tab{padding:8px 10px;font-size:12px;} .brand-text p{display:none;} }

/* ---------- Layout ---------- */
main#app{flex:1;max-width:1060px;width:100%;margin:0 auto;padding:26px 18px 60px;}
.site-footer{text-align:center;padding:18px;font-size:11px;color:#9aa0a8;border-top:1px solid var(--line-soft);}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:14px 6px 26px;}
.hero h2{font-family:"Noto Serif JP",serif;font-size:clamp(21px,4vw,30px);color:var(--navy-deep);margin:0 0 10px;font-weight:900;}
.hero p{color:var(--ink-soft);font-size:13.5px;margin:0 auto;max-width:600px;line-height:1.9;}
.hero-badges{display:flex;justify-content:center;gap:9px;margin-top:16px;flex-wrap:wrap;}
.badge{background:var(--paper);border:1px solid var(--line);color:var(--navy-deep);font-size:12px;padding:6px 14px;border-radius:999px;font-weight:700;}
.badge b{color:var(--gold);font-size:14px;}

/* ---------- Quick cards ---------- */
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
@media (max-width:600px){ .quick-row{grid-template-columns:1fr;} }
.quick-card{
  border:none;border-radius:var(--radius);padding:18px 20px;cursor:pointer;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:var(--shadow-lg);transition:transform .15s ease;
}
.quick-card:hover{transform:translateY(-2px);}
.quick-card h3{margin:0 0 4px;font-family:"Noto Serif JP",serif;font-size:18px;}
.quick-card p{margin:0;font-size:11.5px;opacity:.85;line-height:1.6;}
.quick-go{font-size:12px;font-weight:800;padding:9px 16px;border-radius:999px;white-space:nowrap;}
.quick-all{background:linear-gradient(150deg,var(--navy),var(--navy-deep));color:#fff;}
.quick-all .quick-go{background:var(--gold-soft);color:var(--navy-deep);}
.quick-weak{background:var(--white);border:1.5px solid var(--gold);color:var(--navy-deep);box-shadow:var(--shadow);}
.quick-weak p{color:var(--ink-soft);opacity:1;}
.quick-weak .quick-go{background:var(--gold);color:#fff;}
.quick-weak.disabled{border-color:var(--line);opacity:.6;cursor:default;}
.quick-weak.disabled:hover{transform:none;}
.quick-weak.disabled .quick-go{background:var(--line);color:#8c9199;}

.section-label{font-size:13px;font-weight:800;color:var(--navy-deep);margin:28px 0 12px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

/* ---------- Era grid ---------- */
.era-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;}
.era-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px 20px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  position:relative;overflow:hidden;
}
.era-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--era-color,var(--navy));}
.era-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--era-color,var(--navy));}
.era-no{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;}
.era-card h3{font-family:"Noto Serif JP",serif;margin:3px 0 4px;font-size:18px;color:var(--navy-deep);}
.era-period{font-size:11px;color:var(--ink-soft);}
.era-themes{font-size:11px;color:#8a9099;margin-top:7px;line-height:1.6;min-height:2.4em;}
.era-progress{height:5px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin-top:10px;}
.era-progress>div{height:100%;background:var(--era-color,var(--navy));border-radius:5px;}
.era-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
.era-count{font-weight:800;color:var(--era-color,var(--navy));}
.era-weak{margin-top:6px;font-size:11px;color:var(--bad);font-weight:700;}

/* ---------- Buttons ---------- */
.btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:11px 20px;font-size:14px;transition:filter .15s ease,transform .1s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--paper);color:var(--navy-deep);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--navy);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Setup ---------- */
.setup-box{max-width:620px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;box-shadow:var(--shadow);}
.back-link{display:inline-block;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-bottom:14px;font-weight:600;}
.back-link:hover{color:var(--navy);}
.setup-title{font-family:"Noto Serif JP",serif;font-size:21px;color:var(--navy-deep);margin:0 0 4px;font-weight:900;}
.setup-sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 22px;line-height:1.7;}
.setup-group{margin-bottom:20px;}
.setup-group-label{font-size:12.5px;font-weight:800;color:var(--navy-deep);margin-bottom:9px;}
.choice-row{display:flex;gap:9px;flex-wrap:wrap;}
.choice-pill{
  border:2px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:10px;
  cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;flex:1;min-width:96px;
}
.choice-pill small{display:block;font-weight:500;font-size:10.5px;margin-top:2px;opacity:.85;}
.choice-pill.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.setup-actions{display:flex;justify-content:flex-end;margin-top:6px;}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:660px;margin:0 auto;}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;color:var(--ink-soft);font-weight:700;}
.quiz-score{color:var(--navy-deep);}
.progress-bar{height:7px;background:var(--line-soft);border-radius:7px;overflow:hidden;margin-bottom:20px;}
.progress-bar>div{height:100%;background:var(--gold);border-radius:7px;transition:width .25s ease;}
.qcard{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px 22px 20px;}
.qcard-head{display:flex;gap:8px;margin-bottom:14px;}
.era-tag{font-size:10.5px;font-weight:800;color:var(--era-color,var(--navy));background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:999px;}
.mode-tag{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;}
.mode-tag.choice{background:#eef2f8;color:var(--navy);}
.mode-tag.write{background:#fdf4e3;color:var(--gold);}
.qtext{font-size:16.5px;line-height:1.85;color:var(--ink);font-weight:600;margin:0 0 20px;}
.choices{display:flex;flex-direction:column;gap:9px;}
.choice-btn{
  text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:12px 15px;font-size:14.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;
  line-height:1.6;
}
.choice-letter{
  width:23px;height:23px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--navy);flex-shrink:0;
}
.choice-btn:hover:not(.locked){border-color:var(--navy);background:var(--paper);}
.choice-btn.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:800;}
.choice-btn.correct .choice-letter{background:var(--good);color:#fff;border-color:var(--good);}
.choice-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:800;}
.choice-btn.wrong .choice-letter{background:var(--bad);color:#fff;border-color:var(--bad);}
.choice-btn.dim{opacity:.5;}
.choice-btn.locked{cursor:default;}

.answer-input-row{display:flex;gap:9px;}
.answer-input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink);min-width:0;}
.answer-input:focus{outline:none;border-color:var(--navy);}
.answer-input.correct{border-color:var(--good);background:var(--good-bg);}
.answer-input.wrong{border-color:var(--bad);background:var(--bad-bg);}
.write-hint{font-size:11px;color:#9aa0a8;margin-top:8px;}

.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.85;display:none;}
.feedback.show{display:block;}
.feedback.good{background:var(--good-bg);border:1px solid #c9e6d6;}
.feedback.bad{background:var(--bad-bg);border:1px solid #f2cccc;}
.fb-head{font-weight:900;font-size:14.5px;margin-bottom:6px;font-family:"Noto Serif JP",serif;}
.feedback.good .fb-head{color:var(--good);}
.feedback.bad .fb-head{color:var(--bad);}
.fb-yours{font-size:12.5px;color:var(--ink-soft);margin-bottom:2px;}
.fb-answer{font-weight:800;color:var(--navy-deep);margin-bottom:10px;font-size:14px;}
.fb-block{color:#374151;margin-top:7px;padding-left:0;}
.fb-label{
  display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);
  padding:1px 8px;border-radius:4px;margin-right:7px;vertical-align:1px;
}
.feedback.bad .fb-label{background:var(--bad);}
.quiz-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}

/* ---------- Result ---------- */
.result-box{max-width:640px;margin:0 auto;text-align:center;}
.result-ring{
  width:150px;height:150px;border-radius:50%;margin:6px auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line-soft) 0);position:relative;
}
.result-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;}
.ring-num{position:relative;font-family:"Noto Serif JP",serif;font-weight:900;font-size:32px;color:var(--navy-deep);}
.ring-num small{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;}
.result-title{font-family:"Noto Serif JP",serif;font-size:20px;color:var(--navy-deep);font-weight:900;margin:0 0 6px;}
.result-sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 22px;line-height:1.7;}
.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:26px;}
.wrong-list{text-align:left;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.wl-head{background:var(--paper);padding:11px 15px;font-size:12.5px;font-weight:800;color:var(--navy-deep);border-bottom:1px solid var(--line);}
.wrong-item{padding:13px 15px;border-bottom:1px solid var(--line-soft);font-size:13px;}
.wrong-item:last-child{border-bottom:none;}
.wq{color:var(--ink);margin-bottom:6px;line-height:1.7;font-weight:600;}
.wl-era{display:inline-block;font-size:10px;font-weight:800;color:var(--era-color);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:2px;}
.wa{color:var(--ink-soft);font-size:12.5px;}
.wa b{color:var(--good);}
.wa .mine{color:var(--bad);text-decoration:line-through;margin-right:8px;}
.wex{color:#8a9099;font-size:11.5px;margin-top:5px;line-height:1.7;}
.all-correct{text-align:center;color:var(--good);font-weight:700;font-size:13px;padding:24px;background:var(--good-bg);border-radius:12px;}
.empty-note{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;line-height:1.9;background:var(--paper);border-radius:12px;margin-bottom:18px;}

/* ---------- Review ---------- */
.review-wrap{max-width:720px;margin:0 auto;}
.review-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.rh-num{font-size:14px;color:var(--bad);margin-left:6px;}
.weak-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.weak-group-head{
  background:var(--paper);padding:10px 14px;font-size:13px;font-weight:800;color:var(--navy-deep);
  border-bottom:1px solid var(--line);border-left:4px solid var(--era-color);
  display:flex;justify-content:space-between;
}
.wg-count{color:var(--ink-soft);font-weight:600;font-size:12px;}
.weak-item{padding:12px 14px;border-bottom:1px solid var(--line-soft);position:relative;}
.weak-item:last-child{border-bottom:none;}
.wi-q{font-size:13px;line-height:1.7;color:var(--ink);padding-right:50px;}
.wi-a{font-size:12px;color:var(--ink-soft);margin-top:5px;}
.wi-a b{color:var(--good);}
.wi-miss{color:var(--bad);font-weight:700;margin-left:8px;}
.wi-streak{color:var(--gold);font-weight:700;margin-left:8px;}
.wi-del{position:absolute;right:12px;top:11px;background:none;border:1px solid var(--line);color:#9aa0a8;font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;}
.wi-del:hover{border-color:var(--bad);color:var(--bad);}

/* ---------- Record ---------- */
.record-wrap{max-width:720px;margin:0 auto;}
.rec-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px;}
.rec-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.rec-card span{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.rec-card b{font-family:"Noto Serif JP",serif;font-size:22px;color:var(--navy-deep);}
.rec-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.rec-table th{background:var(--paper);color:var(--navy-deep);font-size:11.5px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
.rec-table td{padding:10px;border-bottom:1px solid var(--line-soft);}
.rec-table .num{text-align:right;}
.rec-table td.warn{color:var(--bad);font-weight:700;}
.rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.danger-zone{margin-top:26px;text-align:center;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);
  background:var(--navy-deep);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:480px){
  .setup-box{padding:20px 15px;}
  .qcard{padding:20px 15px;}
  .qtext{font-size:15.5px;}
  main#app{padding:20px 14px 50px;}
}

/* ---------- 用語辞典（むずかしい語の意味） ---------- */
.term{
  border-bottom:1px dotted var(--gold);
  padding-bottom:1px;
}
.qtext .term{font-weight:700;}
.term-inline{
  font-size:.72em;
  font-weight:500;
  color:var(--ink-soft);
  border-bottom:none;
  margin:0 1px;
  letter-spacing:0;
}
.term[data-t]{cursor:pointer;}
.term[data-t]:hover{background:#fdf4e3;}
.fb-terms{
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(28,36,48,.15);
}
.fb-term{
  font-size:12.5px;
  color:#374151;
  line-height:1.8;
  margin-top:2px;
}
.fb-term b{color:var(--navy-deep);}

/* ---------- 出題タイプ ---------- */
.type-row .choice-pill{min-width:78px;padding:9px 10px;font-size:12.5px;}
.type-pill small{color:inherit;opacity:.7;}
.type-pill.empty{opacity:.45;}
.type-tag{
  font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;
  background:#eaf3ea;color:#2e7d5b;
}
/* 並べ替え問題は選択肢のアイウを読みやすく */
.qtext{white-space:pre-wrap;}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand" onclick="Q.go('home')">
      <span class="brand-mark">史</span>
      <div class="brand-text">
        <h1>歴史クイズ<span class="brand-1000">1000</span></h1>
        <p>都内難関中学受験 対応</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="home"  onclick="Q.go('home')">学習</button>
      <button class="tab" data-tab="review" onclick="Q.go('review')">苦手<span class="tab-badge" id="tabBadge">0</span></button>
      <button class="tab" data-tab="record" onclick="Q.go('record')">記録</button>
      <a class="tab" href="教科選択.html" target="_top" title="教科を選びなおす">⇦教科</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <p>全11時代・1000問以上収録　／　記録はこの端末のブラウザだけに保存されます</p>
</footer>

<div id="toast" class="toast"></div>
<script>
  function DQ(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

(function () {
  /* =========================================================
     用語辞典 ―― むずかしい言葉に、やさしい意味をつける。

        '<div class="era-period">' + esc(era.period) + '</div>' +
        '<div class="era-themes">' + esc(era.themes) + '</div>' +
        '<div class="era-progress"><div style="width:' + acc + '%"></div></div>' +
        '<div class="era-meta">' +
          '<span class="era-count">全' + era.questions.length + '問</span>' +
          '<span>' + (s.ans ? '正答率 ' + acc + '％' : 'まだ挑戦していません') + '</span>' +
        '</div>' +
        (wk ? '<div class="era-weak">苦手 ' + wk + '問</div>' : '') +
      '</button>';
    }).join('');

    app.innerHTML = '' +
    '<section class="hero">' +
      '<h2>時代を選んで、10問ずつ。</h2>' +
      '<p>各時代100問以上・全' + totalQ + '問から毎回ランダムに出題します。4択と記述の両方に対応し、記述は書き方のゆれも読み取って添削します。</p>' +
      '<div class="hero-badges">' +
        '<span class="badge">収録 <b>' + totalQ + '</b> 問</span>' +
        '<span class="badge">時代 <b>' + ERAS.length + '</b> 区分</span>' +
        '<span class="badge">通算正答率 <b>' + rate + '</b>％</span>' +
      '</div>' +
    '</section>' +

    '<div class="quick-row">' +
      '<button class="quick-card quick-all" onclick="Q.setup(\'all\')">' +
        '<div><h3>全時代ランダム10問</h3><p>時代をまたいで出題。実戦形式の総合演習。</p></div>' +
        '<span class="quick-go">はじめる</span>' +
      '</button>' +
      '<button class="quick-card quick-weak' + (weakCount() ? '' : ' disabled') + '" onclick="Q.setup(\'weak\')">' +
        '<div><h3>苦手克服 <span id="weakNum">' + weakCount() + '</span>問</h3>' +
        '<p>' + (weakCount() ? 'まちがえた問題だけを出し直します。' : 'まちがえた問題がここにたまります。') + '</p></div>' +
        '<span class="quick-go">' + (weakCount() ? '復習する' : '—') + '</span>' +
      '</button>' +
    '</div>' +

    '<div class="section-label">時代（単元）から選ぶ</div>' +
    '<div class="era-grid">' + cards + '</div>' +

    '<div class="danger-zone">' +
      '<button class="btn btn-ghost" onclick="Q.resetAll()">全データをリセット（苦手・記録をすべて消去）</button>' +
    '</div>';
    updateBadge();
  }

  /* =========================================================
     画面：出題設定
     ========================================================= */
  var setupCtx = null;

  /* ---------- 出題タイプ（一問一答／年号／並べ替え／理由） ---------- */
  var TYPES = ['すべて', '一問一答', '年号', '並べ替え', '理由'];

  function typeOf(q) { return q.t || '一問一答'; }

  function matchType(item) {
    return pref.type === 'すべて' || typeOf(item.q) === pref.type;
  }

  function typeLabel() {
    return pref.type === 'すべて' ? '' : '「' + pref.type + '」の';
  }

  // 種類・時代・苦手のしぼりこみをまとめて行う
  function poolFor(kind, eraId) {
    var base;
    if (kind === 'all') base = ALL;
    else if (kind === 'weak') base = weakIds().map(itemById).filter(Boolean);
    else base = ALL.filter(function (it) { return it.era.id === eraId; });
    return base.filter(matchType);
  }

  function typePill(val) {
    var n = poolFor(setupCtx.kind, setupCtx.eraId).length;
    var save0 = pref.type;
    pref.type = val;
    var cnt = poolFor(setupCtx.kind, setupCtx.eraId).length;
    pref.type = save0;
    return '<button class="choice-pill type-pill' + (pref.type === val ? ' active' : '') +
           (cnt === 0 ? ' empty' : '') +
           '" data-type="' + val + '" onclick="Q.pickType(\'' + val + '\')">' +
           val + '<small>' + cnt + '問</small></button>';
  }

  function pickType(t) {
    pref.type = t; save(KEY.pref, pref);
    setup(setupCtx.kind, setupCtx.eraId);   // 問題数の選択肢を作り直すため描き直す
  }

  function setup(kind, eraId) {
    if (kind === 'weak' && weakCount() === 0) { toast('まだ苦手な問題はありません'); return; }
    setupCtx = { kind: kind, eraId: eraId || null };

    var pool = poolFor(kind, eraId);              // 出題タイプでしぼったあとの問題
    var poolSize = pool.length;
    var title, sub;
    if (kind === 'all') {
      title = '全時代ランダム';
      sub = typeLabel() + '全' + poolSize + '問からランダムに出題します。';
    } else if (kind === 'weak') {
      title = '苦手克服';
      sub = 'まちがえた' + weakCount() + '問のうち、' + typeLabel() + poolSize +
            '問から出題します。2回続けて正解すると卒業です。';
    } else {
      var era = eraById(eraId);
      title = era.name;
      sub = era.period + '　' + typeLabel() + '全' + poolSize + '問からランダムに出題します。';
    }
    if (poolSize === 0) {
      sub = 'この組み合わせに当てはまる問題がありません。出題タイプを変えてください。';
    }

    // 問題数の選択肢。手持ちより1段だけ上まで出すので、
    // 苦手が少ないときでも「5問」だけにならない。
    var counts = [5, 10, 15, 20, 30].filter(function (n, i, arr) {
      return n <= poolSize || i === 0 || arr[i - 1] < poolSize;
    });
    if (!counts.length) counts = [5];
    var activeCount = counts.indexOf(pref.count) >= 0 ? pref.count : counts[counts.length - 1];

    app.innerHTML = '' +
    '<div class="setup-box">' +
      '<div class="back-link" onclick="Q.go(\'home\')">← もどる</div>' +
      '<h2 class="setup-title">' + esc(title) + '</h2>' +
      '<p class="setup-sub">' + esc(sub) + '</p>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">出題タイプ</div>' +
        '<div class="choice-row type-row">' + TYPES.map(typePill).join('') + '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">解答の形式</div>' +
        '<div class="choice-row">' +
          modePill('choice', '4択', '選択肢から選ぶ') +
          modePill('write', '記述', 'キーボードで書く') +
          modePill('mix', 'ミックス', '4択と記述が交ざる') +
        '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">むずかしい語の意味</div>' +
        '<div class="choice-row">' +
          glossPill('on', '文中に出す', '語のあとに（意味）') +
          glossPill('tap', 'タップで見る', '語を押すと意味が出る') +
          glossPill('off', 'つけない', '本番と同じ形で解く') +
        '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">問題数</div>' +
        '<div class="choice-row">' +
          counts.map(function (n) {
            return '<button class="choice-pill' + (activeCount === n ? ' active' : '') +
                   '" data-count="' + n + '" onclick="Q.pickCount(' + n + ')">' + n + '問</button>';
          }).join('') +
        '</div>' +
      '</div>' +

      '<div class="setup-actions">' +
        '<button class="btn btn-primary" onclick="Q.start()">スタート</button>' +
      '</div>' +
    '</div>';
  }

  function modePill(val, label, note) {
    return '<button class="choice-pill' + (pref.mode === val ? ' active' : '') +
           '" data-mode="' + val + '" onclick="Q.pickMode(\'' + val + '\')">' +
           label + '<small>' + note + '</small></button>';
  }
  function glossPill(val, label, note) {
    return '<button class="choice-pill' + (pref.gloss === val ? ' active' : '') +
           '" data-gloss="' + val + '" onclick="Q.pickGloss(\'' + val + '\')">' +
           label + '<small>' + note + '</small></button>';
  }
  function pickGloss(g) {
    pref.gloss = g; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-gloss]'), function (b) {
      b.classList.toggle('active', b.dataset.gloss === g);
    });
  }
  function pickMode(m) {
    pref.mode = m; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('active', b.dataset.mode === m);
    });
  }
  function pickCount(n) {
    pref.count = n; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (b) {
      b.classList.toggle('active', Number(b.dataset.count) === n);
    });
  }

  /* =========================================================
     出題
     ========================================================= */
  var session = null;

  function start() {
    var pool = poolFor(setupCtx.kind, setupCtx.eraId);
    if (!pool.length) { toast('出題できる問題がありません'); go('home'); return; }

    var picked = shuffle(pool).slice(0, Math.min(pref.count, pool.length));
    session = {
      kind: setupCtx.kind,
      eraId: setupCtx.eraId,
      list: picked.map(function (it) {
        var m = pref.mode === 'mix' ? (Math.random() < 0.5 ? 'choice' : 'write') : pref.mode;
        return {
          item: it,
          mode: m,
          order: shuffle([0, 1, 2, 3]),
          result: null
        };
      }),
      i: 0,
      score: 0,
      points: 0,
      log: []
    };
    renderQuestion();
  }

  function renderQuestion() {
    setTab(null);
    var s = session, cur = s.list[s.i], it = cur.item, q = it.q;
    var pct = Math.round(s.i / s.list.length * 100);

    var body;
    if (cur.mode === 'choice') {
      body = '<div class="choices" id="choices">' +
        cur.order.map(function (oi, n) {
          return '<button class="choice-btn" data-oi="' + oi + '" onclick="Q.answerChoice(' + oi + ')">' +
                 '<span class="choice-letter">' + (n + 1) + '</span>' +
                 '<span>' + esc(q.a[oi]) + '</span></button>';
        }).join('') +
      '</div>';
    } else {
      body = '<div class="answer-input-row">' +
        '<input class="answer-input" id="ansInput" type="text" autocomplete="off" ' +
        'placeholder="答えを書いてください" onkeydown="Q.inputKey(event)">' +
        '<button class="btn btn-primary" id="submitBtn" onclick="Q.answerWrite()">採点</button>' +
      '</div>' +
      '<div class="write-hint">漢字で書くのが理想ですが、ひらがなでも判定します。</div>';
    }

    app.innerHTML = '' +
    '<div class="quiz-wrap">' +
      '<div class="quiz-top">' +
        '<span>' + (s.i + 1) + ' / ' + s.list.length + '問</span>' +
        '<span class="quiz-score">正解 ' + s.score + '</span>' +
      '</div>' +
      '<div class="progress-bar"><div style="width:' + pct + '%"></div></div>' +
      '<div class="qcard">' +
        '<div class="qcard-head">' +
          '<span class="era-tag" style="--era-color:' + it.era.color + '">' + esc(it.era.short) + '</span>' +
          '<span class="mode-tag ' + cur.mode + '">' + (cur.mode === 'choice' ? '4択' : '記述') + '</span>' +
          (typeOf(q) !== '一問一答'
            ? '<span class="type-tag">' + esc(typeOf(q)) + '</span>' : '') +
        '</div>' +
        '<p class="qtext">' + gloss(q.q, pref.gloss, q.a[0]) + '</p>' +
        body +
        '<div class="feedback" id="feedback"></div>' +
        '<div class="quiz-actions" id="quizActions">' +
          '<button class="btn btn-ghost" onclick="Q.quit()">やめる</button>' +
        '</div>' +
      '</div>' +
    '</div>';

    if (cur.mode === 'write') {
      var el = document.getElementById('ansInput');
      if (el) el.focus();
    }
  }

  function answerChoice(oi) {
    var cur = session.list[session.i];
    if (cur.result) return;
    var q = cur.item.q;
    var correct = (oi === 0);
    var btns = document.querySelectorAll('.choice-btn');
    Array.prototype.forEach.call(btns, function (b) {
      var bi = Number(b.dataset.oi);
      b.classList.add('locked');
      if (bi === 0) b.classList.add('correct');
      else if (bi === oi) b.classList.add('wrong');
      else b.classList.add('dim');
      b.onclick = null;
    });

    // 選択肢が用語か、説明文かで言い方を変える
    var isTerm = q.a[0].length <= 12 && !/(ため|こと|から|ように|なった|られた)$/.test(q.a[0]);
    var comment, advice;
    if (correct) {
      comment = '正解です。';
      advice = isTerm
        ? '選べただけで満足せず、記述モードでも書けるか試してみましょう。'
        : '選べただけで満足せず、なぜそうなったのかを自分の言葉で説明してみましょう。';
    } else {
      comment = '不正解。あなたが選んだ「' + q.a[oi] + '」ではなく、正解は「' + q.a[0] + '」です。';
      advice = isTerm
        ? '「' + q.a[oi] + '」がどの時代・どのできごとに関わる語かを調べておくと、次から迷わなくなります。'
        : '選んだ選択肢のどこがちがっていたのかを、解説と見くらべて確かめておきましょう。';
    }
    finish(correct, correct ? 1 : 0, comment, advice, null);
  }

  function answerWrite() {
    var cur = session.list[session.i];
    if (cur.result) return;
    var el = document.getElementById('ansInput');
    var raw = el ? el.value : '';
    var g = Grader.grade(raw, cur.item.q);

    if (el) {
      el.classList.add(g.ok ? 'correct' : 'wrong');
      el.readOnly = true;
    }
    var sb = document.getElementById('submitBtn');
    if (sb) { sb.disabled = true; sb.textContent = '採点ずみ'; }

    finish(g.ok, g.score, g.comment, g.advice, raw);
  }

  function finish(correct, points, comment, advice, userAnswer) {
    var s = session, cur = s.list[s.i], q = cur.item.q;
    cur.result = { correct: correct, points: points, user: userAnswer };
    if (correct) s.score++;
    s.points += points;
    recordAnswer(cur.item, correct);
    s.log.push({
      item: cur.item, correct: correct, user: userAnswer,
      mode: cur.mode, comment: comment
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (correct ? 'good' : 'bad');
    fb.innerHTML = '' +
      '<div class="fb-head">' + (correct ? '○ 正解' : '× 不正解') + '</div>' +
      (userAnswer !== null && userAnswer !== undefined && userAnswer !== ''
        ? '<div class="fb-yours">あなたの答え：<b>' + esc(userAnswer) + '</b></div>' : '') +
      '<div class="fb-answer">模範解答：' + esc(q.a[0]) + '</div>' +
      '<div class="fb-block"><span class="fb-label">添削</span>' + esc(comment) + '</div>' +
      (advice ? '<div class="fb-block"><span class="fb-label">アドバイス</span>' + esc(advice) + '</div>' : '') +
      '<div class="fb-block"><span class="fb-label">解説</span>' + esc(q.ex) + '</div>' +
      termListHtml([q.q, q.ex].concat(q.a));

    var last = (s.i === s.list.length - 1);
    document.getElementById('quizActions').innerHTML =
      '<button class="btn btn-ghost" onclick="Q.quit()">やめる</button>' +
      '<button class="btn btn-primary" id="nextBtn" onclick="Q.next()">' +
      (last ? '結果を見る' : '次の問題へ') + '</button>';
    var nb = document.getElementById('nextBtn');
    if (nb) nb.focus();
    updateBadge();
  }

  function next() {
    if (session.i < session.list.length - 1) { session.i++; renderQuestion(); }
    else viewResult();
  }

  function quit() {
    if (confirm('このセットをやめて、学習画面にもどりますか？（ここまでの記録は保存されています）')) go('home');
  }

  function inputKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var cur = session.list[session.i];
      if (cur.result) next(); else answerWrite();
    }
  }

  /* =========================================================
     画面：結果
     ========================================================= */
  function viewResult() {
    var s = session;
    var total = s.list.length;
    var pct = Math.round(s.score / total * 100);
    if (s.kind === 'era') recordBest(s.eraId, pct);

    var title, sub;
    if (pct === 100) { title = '全問正解'; sub = '完璧です。次は記述モードや、ほかの時代に進みましょう。'; }
    else if (pct >= 80) { title = 'よくできました'; sub = '合格ラインです。まちがえた問題は「苦手」に入っています。'; }
    else if (pct >= 50) { title = 'もう一歩'; sub = '解説を読み直してから、同じ時代をもう一度回してみましょう。'; }
    else { title = 'ここが伸びしろ'; sub = 'まずは解説を読むところから。苦手タブで復習できます。'; }

    var wrongs = s.log.filter(function (l) { return !l.correct; });
    var wrongHtml = wrongs.length
      ? '<div class="wrong-list">' +
          '<div class="wl-head">まちがえた問題（' + wrongs.length + '問）― 苦手に登録しました</div>' +
          wrongs.map(function (l) {
            return '<div class="wrong-item">' +
              '<div class="wq"><span class="wl-era" style="--era-color:' + l.item.era.color + '">' +
                esc(l.item.era.short) + '</span>' + esc(l.item.q.q) + '</div>' +
              '<div class="wa">' +
                (l.user ? '<span class="mine">' + esc(l.user) + '</span>' : '') +
                '正解：<b>' + esc(l.item.q.a[0]) + '</b></div>' +
              '<div class="wex">' + esc(l.item.q.ex) + '</div>' +
            '</div>';
          }).join('') +
        '</div>'
      : '<div class="all-correct">まちがえた問題はありません。</div>';

    setTab(null);
    app.innerHTML = '' +
    '<div class="result-box">' +
      '<div class="result-ring" style="--pct:' + pct + '">' +
        '<div class="ring-num">' + s.score + '<small>／' + total + '問</small></div>' +
      '</div>' +
      '<h2 class="result-title">' + title + '</h2>' +
      '<p class="result-sub">' + sub + '　正答率' + pct + '％</p>' +
      '<div class="result-actions">' +
        '<button class="btn btn-primary" onclick="Q.retry()">もう一度10問</button>' +
        (weakCount() ? '<button class="btn btn-gold" onclick="Q.setup(\'weak\')">苦手を復習（' + weakCount() + '問）</button>' : '') +
        '<button class="btn btn-ghost" onclick="Q.go(\'home\')">学習トップへ</button>' +
      '</div>' +
      wrongHtml +
    '</div>';
    updateBadge();
  }

  function retry() {
    setupCtx = { kind: session.kind, eraId: session.eraId };
    start();
  }

  /* =========================================================
     画面：苦手
     ========================================================= */
  function viewReview() {
    setTab('review');
    var ids = weakIds().sort(function (a, b) { return (weak[b].m || 0) - (weak[a].m || 0); });
    if (!ids.length) {
      app.innerHTML =
        '<div class="setup-box"><h2 class="setup-title">苦手リスト</h2>' +
        '<p class="setup-sub">まだ登録はありません。問題をまちがえると、ここに自動でたまっていきます。</p>' +
        '<div class="empty-note">2回続けて正解すると、そのままリストから消えます。<br>記録はこの端末のブラウザにだけ残るので、タブを閉じても消えません。</div>' +
        '<div class="setup-actions"><button class="btn btn-primary" onclick="Q.go(\'home\')">学習をはじめる</button></div></div>';
      return;
    }

    // 時代ごとに集計
    var byEra = {};
    ids.forEach(function (id) {
      var it = itemById(id); if (!it) return;
      (byEra[it.era.id] = byEra[it.era.id] || []).push({ id: id, it: it, w: weak[id] });
    });

    var groups = ERAS.filter(function (e) { return byEra[e.id]; }).map(function (era) {
      var list = byEra[era.id];
      return '<div class="weak-group">' +
        '<div class="weak-group-head" style="--era-color:' + era.color + '">' +
          '<span>' + esc(era.name) + '</span><span class="wg-count">' + list.length + '問</span>' +
        '</div>' +
        list.map(function (r) {
          return '<div class="weak-item">' +
            '<div class="wi-q">' + esc(r.it.q.q) + '</div>' +
            '<div class="wi-a">正解：<b>' + esc(r.it.q.a[0]) + '</b>' +
              '<span class="wi-miss">×' + (r.w.m || 1) + '回</span>' +
              (r.w.s ? '<span class="wi-streak">あと' + (2 - r.w.s) + '回正解で卒業</span>' : '') +
            '</div>' +
            '<button class="wi-del" data-id="' + esc(r.id) + '" onclick="Q.dropWeak(this.dataset.id)">削除</button>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');

    app.innerHTML = '' +
    '<div class="review-wrap">' +
      '<div class="review-head">' +
        '<div><h2 class="setup-title">苦手リスト <span class="rh-num">' + ids.length + '問</span></h2>' +
        '<p class="setup-sub">2回続けて正解すると自動で卒業します。</p></div>' +
        '<button class="btn btn-gold" onclick="Q.setup(\'weak\')">まとめて復習</button>' +
      '</div>' + groups +
    '</div>';
  }

  function dropWeak(id) {
    delete weak[id]; save(KEY.weak, weak);
    toast('苦手リストから削除しました');
    viewReview(); updateBadge();
  }

  /* =========================================================
     画面：記録
     ========================================================= */
  function viewRecord() {
    setTab('record');
    var totalAns = 0, totalCor = 0;
    ERAS.forEach(function (e) { var s = stat[e.id]; if (s) { totalAns += s.ans; totalCor += s.cor; } });
    var rate = totalAns ? Math.round(totalCor / totalAns * 100) : 0;

    var rows = ERAS.map(function (era) {
      var s = stat[era.id] || { ans: 0, cor: 0, best: 0 };
      var acc = s.ans ? Math.round(s.cor / s.ans * 100) : 0;
      var wk = weakIds().filter(function (id) { return id.indexOf(era.id + '-') === 0; }).length;
      return '<tr>' +
        '<td><span class="rec-dot" style="background:' + era.color + '"></span>' + esc(era.name) + '</td>' +
        '<td class="num">' + s.ans + '</td>' +
        '<td class="num">' + (s.ans ? acc + '％' : '—') + '</td>' +
        '<td class="num">' + (s.best ? s.best + '％' : '—') + '</td>' +
        '<td class="num' + (wk ? ' warn' : '') + '">' + wk + '</td>' +
      '</tr>';
    }).join('');

    app.innerHTML = '' +
    '<div class="record-wrap">' +
      '<h2 class="setup-title">学習の記録</h2>' +
      '<p class="setup-sub">この端末（' + esc(deviceId) + '）のブラウザに保存されています。ほかの端末とは別の記録になります。</p>' +
      '<div class="rec-summary">' +
        '<div class="rec-card"><span>のべ解答数</span><b>' + totalAns + '</b></div>' +
        '<div class="rec-card"><span>通算正答率</span><b>' + rate + '％</b></div>' +
        '<div class="rec-card"><span>苦手の数</span><b>' + weakCount() + '</b></div>' +
      '</div>' +
      '<table class="rec-table">' +
        '<thead><tr><th>時代</th><th class="num">解答</th><th class="num">正答率</th><th class="num">最高</th><th class="num">苦手</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div class="danger-zone">' +
        '<button class="btn btn-ghost" onclick="Q.resetAll()">記録をすべて消去</button>' +
      '</div>' +
    '</div>';
  }

  function resetAll() {
    if (!confirm('苦手リストと学習記録をすべて消去します。もとにもどせません。よろしいですか？')) return;
    weak = {}; stat = {};
    save(KEY.weak, weak); save(KEY.stat, stat);
    toast('記録を消去しました');
    go('home');
  }

  /* =========================================================
     ルーティング
     ========================================================= */
  function go(name) {
    window.scrollTo(0, 0);
    if (name === 'home') viewHome();
    else if (name === 'review') viewReview();
    else if (name === 'record') viewRecord();
    updateBadge();
  }

  document.addEventListener('keydown', function (e) {
    if (!session || !document.querySelector('.qcard')) return;
    var cur = session.list[session.i];
    if (!cur) return;
    if (cur.mode === 'choice' && !cur.result && e.key >= '1' && e.key <= '4') {
      var btns = document.querySelectorAll('.choice-btn');
      var b = btns[Number(e.key) - 1];
      if (b) b.click();
    } else if (cur.result && e.key === 'Enter' && document.activeElement.tagName !== 'INPUT') {
      next();
    }
  });

  global.Q = {
    go: go, setup: setup, start: start, retry: retry, quit: quit, next: next,
    pickMode: pickMode, pickCount: pickCount, pickGloss: pickGloss, pickType: pickType, term: showTerm,
    answerChoice: answerChoice, answerWrite: answerWrite, inputKey: inputKey,
    dropWeak: dropWeak, resetAll: resetAll
  };

  go('home');
})(window);
</script>
</body>
</html>
