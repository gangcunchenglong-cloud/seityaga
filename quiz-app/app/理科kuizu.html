<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>理科クイズ ｜ 小学校 全単元</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;
  --paper:#f7faf8;
  --ink:#1c2430;
  --ink-soft:#5a6472;
  --navy:#1a6e5c;
  --navy-deep:#0f4a3d;
  --gold:#e08a2b;
  --gold-soft:#f3c98a;
  --line:#e0e6e0;
  --line-soft:#edf1ec;
  --good:#1e7a4c;
  --good-bg:#eef8f2;
  --bad:#c23b3b;
  --bad-bg:#fdeeee;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,36,48,.06), 0 1px 2px rgba(28,36,48,.04);
  --shadow-lg:0 10px 30px rgba(15,74,61,.10), 0 2px 8px rgba(15,74,61,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--white);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}

/* ---------- Header ---------- */
.site-header{background:var(--white);border-bottom:2px solid var(--navy);position:sticky;top:0;z-index:20;}
.header-inner{max-width:1060px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
.brand-mark{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(155deg,var(--navy),var(--navy-deep));
  color:var(--gold-soft);font-family:"Noto Serif JP",serif;font-weight:900;font-size:21px;
  display:flex;align-items:center;justify-content:center;
}
.brand-text h1{font-family:"Noto Serif JP",serif;font-size:18px;margin:0;color:var(--navy-deep);line-height:1.2;font-weight:900;}
.brand-text p{margin:2px 0 0;font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em;}

.tabs{display:flex;gap:4px;}
.tab{
  border:none;background:transparent;color:var(--ink-soft);
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{background:var(--paper);color:var(--navy-deep);}
.tab.active{background:var(--navy);color:#fff;}
.tab-badge{
  background:var(--bad);color:#fff;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;display:inline-flex;
  align-items:center;justify-content:center;padding:0 5px;
}
.tab-badge.zero{background:#c9ccd1;}
.tab.active .tab-badge{background:var(--gold-soft);color:var(--navy-deep);}
a.tab{text-decoration:none;}
@media (max-width:430px){ .tab{padding:8px 10px;font-size:12px;} .brand-text p{display:none;} }

/* ---------- Layout ---------- */
main#app{flex:1;max-width:1060px;width:100%;margin:0 auto;padding:26px 18px 60px;}
.site-footer{text-align:center;padding:18px;font-size:11px;color:#9aa0a8;border-top:1px solid var(--line-soft);}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:14px 6px 26px;}
.hero h2{font-family:"Noto Serif JP",serif;font-size:clamp(21px,4vw,30px);color:var(--navy-deep);margin:0 0 10px;font-weight:900;}
.hero p{color:var(--ink-soft);font-size:13.5px;margin:0 auto;max-width:600px;line-height:1.9;}
.hero-badges{display:flex;justify-content:center;gap:9px;margin-top:16px;flex-wrap:wrap;}
.badge{background:var(--paper);border:1px solid var(--line);color:var(--navy-deep);font-size:12px;padding:6px 14px;border-radius:999px;font-weight:700;}
.badge b{color:var(--gold);font-size:14px;}

/* ---------- Quick cards ---------- */
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
@media (max-width:600px){ .quick-row{grid-template-columns:1fr;} }
.quick-card{
  border:none;border-radius:var(--radius);padding:18px 20px;cursor:pointer;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:var(--shadow-lg);transition:transform .15s ease;
}
.quick-card:hover{transform:translateY(-2px);}
.quick-card h3{margin:0 0 4px;font-family:"Noto Serif JP",serif;font-size:18px;}
.quick-card p{margin:0;font-size:11.5px;opacity:.85;line-height:1.6;}
.quick-go{font-size:12px;font-weight:800;padding:9px 16px;border-radius:999px;white-space:nowrap;}
.quick-all{background:linear-gradient(150deg,var(--navy),var(--navy-deep));color:#fff;}
.quick-all .quick-go{background:var(--gold-soft);color:var(--navy-deep);}
.quick-weak{background:var(--white);border:1.5px solid var(--gold);color:var(--navy-deep);box-shadow:var(--shadow);}
.quick-weak p{color:var(--ink-soft);opacity:1;}
.quick-weak .quick-go{background:var(--gold);color:#fff;}
.quick-weak.disabled{border-color:var(--line);opacity:.6;cursor:default;}
.quick-weak.disabled:hover{transform:none;}
.quick-weak.disabled .quick-go{background:var(--line);color:#8c9199;}

.section-label{font-size:13px;font-weight:800;color:var(--navy-deep);margin:28px 0 12px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

/* ---------- Era grid ---------- */
.era-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;}
.era-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px 20px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  position:relative;overflow:hidden;
}
.era-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--era-color,var(--navy));}
.era-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--era-color,var(--navy));}
.era-no{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;}
.era-card h3{font-family:"Noto Serif JP",serif;margin:3px 0 4px;font-size:18px;color:var(--navy-deep);}
.era-period{font-size:11px;color:var(--ink-soft);}
.era-themes{font-size:11px;color:#8a9099;margin-top:7px;line-height:1.6;min-height:2.4em;}
.era-progress{height:5px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin-top:10px;}
.era-progress>div{height:100%;background:var(--era-color,var(--navy));border-radius:5px;}
.era-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
.era-count{font-weight:800;color:var(--era-color,var(--navy));}
.era-weak{margin-top:6px;font-size:11px;color:var(--bad);font-weight:700;}

/* ---------- Buttons ---------- */
.btn{border:none;cursor:pointer;font-weight:700;border-radius:10px;padding:11px 20px;font-size:14px;transition:filter .15s ease,transform .1s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--paper);color:var(--navy-deep);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--navy);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Setup ---------- */
.setup-box{max-width:620px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;box-shadow:var(--shadow);}
.back-link{display:inline-block;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-bottom:14px;font-weight:600;}
.back-link:hover{color:var(--navy);}
.setup-title{font-family:"Noto Serif JP",serif;font-size:21px;color:var(--navy-deep);margin:0 0 4px;font-weight:900;}
.setup-sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 22px;line-height:1.7;}
.setup-group{margin-bottom:20px;}
.setup-group-label{font-size:12.5px;font-weight:800;color:var(--navy-deep);margin-bottom:9px;}
.choice-row{display:flex;gap:9px;flex-wrap:wrap;}
.choice-pill{
  border:2px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:10px;
  cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;flex:1;min-width:96px;
}
.choice-pill small{display:block;font-weight:500;font-size:10.5px;margin-top:2px;opacity:.85;}
.choice-pill.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.setup-actions{display:flex;justify-content:flex-end;margin-top:6px;}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:660px;margin:0 auto;}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;color:var(--ink-soft);font-weight:700;}
.quiz-score{color:var(--navy-deep);}
.progress-bar{height:7px;background:var(--line-soft);border-radius:7px;overflow:hidden;margin-bottom:20px;}
.progress-bar>div{height:100%;background:var(--gold);border-radius:7px;transition:width .25s ease;}
.qcard{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px 22px 20px;}
.qcard-head{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.era-tag{font-size:10.5px;font-weight:800;color:var(--era-color,var(--navy));background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:999px;}
.mode-tag{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;}
.mode-tag.choice{background:#eaf3f0;color:var(--navy);}
.mode-tag.write{background:#fdf1e2;color:var(--gold);}
.qtext{font-size:16.5px;line-height:1.85;color:var(--ink);font-weight:600;margin:0 0 20px;}
.choices{display:flex;flex-direction:column;gap:9px;}
.choice-btn{
  text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:12px 15px;font-size:14.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;
  line-height:1.6;
}
.choice-letter{
  width:23px;height:23px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--navy);flex-shrink:0;
}
.choice-btn:hover:not(.locked){border-color:var(--navy);background:var(--paper);}
.choice-btn.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:800;}
.choice-btn.correct .choice-letter{background:var(--good);color:#fff;border-color:var(--good);}
.choice-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:800;}
.choice-btn.wrong .choice-letter{background:var(--bad);color:#fff;border-color:var(--bad);}
.choice-btn.dim{opacity:.5;}
.choice-btn.locked{cursor:default;}

.answer-input-row{display:flex;gap:9px;}
.answer-input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink);min-width:0;}
.answer-input:focus{outline:none;border-color:var(--navy);}
.answer-input.correct{border-color:var(--good);background:var(--good-bg);}
.answer-input.wrong{border-color:var(--bad);background:var(--bad-bg);}
.write-hint{font-size:11px;color:#9aa0a8;margin-top:8px;}

.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.85;display:none;}
.feedback.show{display:block;}
.feedback.good{background:var(--good-bg);border:1px solid #c9e6d6;}
.feedback.bad{background:var(--bad-bg);border:1px solid #f2cccc;}
.fb-head{font-weight:900;font-size:14.5px;margin-bottom:6px;font-family:"Noto Serif JP",serif;}
.feedback.good .fb-head{color:var(--good);}
.feedback.bad .fb-head{color:var(--bad);}
.fb-yours{font-size:12.5px;color:var(--ink-soft);margin-bottom:2px;}
.fb-answer{font-weight:800;color:var(--navy-deep);margin-bottom:10px;font-size:14px;}
.fb-block{color:#374151;margin-top:7px;padding-left:0;}
.fb-label{
  display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);
  padding:1px 8px;border-radius:4px;margin-right:7px;vertical-align:1px;
}
.feedback.bad .fb-label{background:var(--bad);}
.quiz-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}

/* ---------- Result ---------- */
.result-box{max-width:640px;margin:0 auto;text-align:center;}
.result-ring{
  width:150px;height:150px;border-radius:50%;margin:6px auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line-soft) 0);position:relative;
}
.result-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;}
.ring-num{position:relative;font-family:"Noto Serif JP",serif;font-weight:900;font-size:32px;color:var(--navy-deep);}
.ring-num small{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;}
.result-title{font-family:"Noto Serif JP",serif;font-size:20px;color:var(--navy-deep);font-weight:900;margin:0 0 6px;}
.result-sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 22px;line-height:1.7;}
.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:26px;}
.wrong-list{text-align:left;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.wl-head{background:var(--paper);padding:11px 15px;font-size:12.5px;font-weight:800;color:var(--navy-deep);border-bottom:1px solid var(--line);}
.wrong-item{padding:13px 15px;border-bottom:1px solid var(--line-soft);font-size:13px;}
.wrong-item:last-child{border-bottom:none;}
.wq{color:var(--ink);margin-bottom:6px;line-height:1.7;font-weight:600;}
.wl-era{display:inline-block;font-size:10px;font-weight:800;color:var(--era-color);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:2px;}
.wa{color:var(--ink-soft);font-size:12.5px;}
.wa b{color:var(--good);}
.wa .mine{color:var(--bad);text-decoration:line-through;margin-right:8px;}
.wex{color:#8a9099;font-size:11.5px;margin-top:5px;line-height:1.7;}
.all-correct{text-align:center;color:var(--good);font-weight:700;font-size:13px;padding:24px;background:var(--good-bg);border-radius:12px;}
.empty-note{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;line-height:1.9;background:var(--paper);border-radius:12px;margin-bottom:18px;}

/* ---------- Review ---------- */
.review-wrap{max-width:720px;margin:0 auto;}
.review-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.rh-num{font-size:14px;color:var(--bad);margin-left:6px;}
.weak-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.weak-group-head{
  background:var(--paper);padding:10px 14px;font-size:13px;font-weight:800;color:var(--navy-deep);
  border-bottom:1px solid var(--line);border-left:4px solid var(--era-color);
  display:flex;justify-content:space-between;
}
.wg-count{color:var(--ink-soft);font-weight:600;font-size:12px;}
.weak-item{padding:12px 14px;border-bottom:1px solid var(--line-soft);position:relative;}
.weak-item:last-child{border-bottom:none;}
.wi-q{font-size:13px;line-height:1.7;color:var(--ink);padding-right:50px;}
.wi-a{font-size:12px;color:var(--ink-soft);margin-top:5px;}
.wi-a b{color:var(--good);}
.wi-miss{color:var(--bad);font-weight:700;margin-left:8px;}
.wi-streak{color:var(--gold);font-weight:700;margin-left:8px;}
.wi-del{position:absolute;right:12px;top:11px;background:none;border:1px solid var(--line);color:#9aa0a8;font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer;}
.wi-del:hover{border-color:var(--bad);color:var(--bad);}

/* ---------- Record ---------- */
.record-wrap{max-width:720px;margin:0 auto;}
.rec-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px;}
.rec-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.rec-card span{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.rec-card b{font-family:"Noto Serif JP",serif;font-size:22px;color:var(--navy-deep);}
.rec-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.rec-table th{background:var(--paper);color:var(--navy-deep);font-size:11.5px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
.rec-table td{padding:10px;border-bottom:1px solid var(--line-soft);}
.rec-table .num{text-align:right;}
.rec-table td.warn{color:var(--bad);font-weight:700;}
.rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.danger-zone{margin-top:26px;text-align:center;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);
  background:var(--navy-deep);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:480px){
  .setup-box{padding:20px 15px;}
  .qcard{padding:20px 15px;}
  .qtext{font-size:15.5px;}
  main#app{padding:20px 14px 50px;}
}

/* ---------- 用語辞典（むずかしい語の意味） ---------- */
.term{
  border-bottom:1px dotted var(--gold);
  padding-bottom:1px;
}
.qtext .term{font-weight:700;}
.term-inline{
  font-size:.72em;
  font-weight:500;
  color:var(--ink-soft);
  border-bottom:none;
  margin:0 1px;
  letter-spacing:0;
}
.term[data-t]{cursor:pointer;}
.term[data-t]:hover{background:#fdf1e2;}
.fb-terms{
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(28,36,48,.15);
}
.fb-term{
  font-size:12.5px;
  color:#374151;
  line-height:1.8;
  margin-top:2px;
}
.fb-term b{color:var(--navy-deep);}

/* ---------- 出題タイプ ---------- */
.type-row .choice-pill{min-width:78px;padding:9px 10px;font-size:12.5px;}
.type-pill small{color:inherit;opacity:.7;}
.type-pill.empty{opacity:.45;}
.type-tag{
  font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;
  background:#eaf3ea;color:#2e7d5b;
}
.qtext{white-space:pre-wrap;}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand" onclick="Q.go('home')">
      <span class="brand-mark">理</span>
      <div class="brand-text">
        <h1>理科クイズ</h1>
        <p>小学校 全単元 対応</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="home"  onclick="Q.go('home')">学習</button>
      <button class="tab" data-tab="review" onclick="Q.go('review')">苦手<span class="tab-badge" id="tabBadge">0</span></button>
      <button class="tab" data-tab="record" onclick="Q.go('record')">記録</button>
      <a class="tab" href="教科選択.html" target="_top" title="教科を選びなおす">⇦教科</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <p>全10単元・1120問収録　／　記録はこの端末のブラウザだけに保存されます</p>
</footer>

<div id="toast" class="toast"></div>
<script>
(function () {
  /* =========================================================
     用語辞典 ―― むずかしい言葉に、やさしい意味をつける。
     ========================================================= */
  window.YOUGO = {
    /* ---- 植物 ---- */
    "光合成": "植物が日光を受けて、水と二酸化炭素からでんぷんと酸素をつくるはたらき",
    "蒸散": "植物が根から吸い上げた水を、主に葉の気孔から水蒸気として出すはたらき",

      {q:"暗い場所に一日置いた植物の葉と、日光によく当てた葉にヨウ素液をつけて比べると色の変化にちがいが出るのはなぜでしょう。", a:["日光に当てた葉だけで光合成が行われでんぷんができたから","暗い場所の方が光合成がさかんに行われるから","葉の色がちがうため反応もちがって見えるだけだから","ヨウ素液の濃さが葉によって変わるから"], ex:"光合成には光が必要なため、日光に当てた葉にはでんぷんができてヨウ素液で青むらさき色になりますが、暗い場所の葉にはでんぷんができません。"},
      {q:"植物のからだの中の水が、水蒸気となって気孔から空気中に出ていく現象を何というでしょう。", a:["蒸散","光合成","呼吸","発芽"], ex:"根から吸い上げられた水の一部は、葉の気孔から水蒸気となって空気中に出ていきます。このはたらきを蒸散といいます。"},
      {q:"気孔は葉の表側と裏側のどちらに多く見られることが多いでしょう。", a:["裏側","表側","表と裏にまったく同じ数だけある","葉には気孔はない"], ex:"多くの植物では、気孔は葉の裏側に多く見られ、そこから盛んに蒸散が行われます。"},
      {q:"植物にふくろをかぶせて日光の当たる場所に置いておくと、ふくろの内側に水てきがつくのはなぜでしょう。", a:["葉から蒸散された水蒸気がふくろの内側で水にもどるから","ふくろの外の水がしみこんできたから","根から水があふれ出したから","光合成でできた酸素が水に変わったから"], ex:"葉の気孔から出た水蒸気がふくろの中にたまり、冷えて水てきになってふくろの内側につきます。"},
      {q:"蒸散が起こることで、植物にとってどのような利点があるでしょう。", a:["根からの水の吸い上げを助ける","花粉を遠くまで飛ばせる","種子をつくりやすくする","葉の色を濃くする"], ex:"葉から水蒸気が出ていくことで、根からの水の吸い上げが盛んになり、水や養分をからだ全体に運ぶのを助けます。"},
      {q:"ワセリンを葉の裏側全体にぬって気孔をふさぐと、その葉からの蒸散の量はどうなるでしょう。", a:["蒸散の量が大きく減る","蒸散の量が大きく増える","まったく変化しない","蒸散が表側だけで盛んになる"], ex:"気孔をふさぐと水蒸気の出口がなくなるため、その部分からの蒸散量は大きく減ります。"},
      {q:"晴れて気温が高い日と、くもりで気温が低い日とでは、植物の蒸散量はどちらが多くなりやすいでしょう。", a:["晴れて気温が高い日","くもりで気温が低い日","天気によって蒸散量は変わらない","夜になるとどちらも蒸散量が最大になる"], ex:"気温が高く日光が強い日ほど気孔が開きやすく、蒸散が盛んに行われます。"},
      {q:"蒸散によって植物のからだの中の温度はどうなると考えられるでしょう。", a:["水が蒸発するときに熱をうばうため温度が下がりやすい","水が蒸発するときに熱を出すため温度が上がりやすい","蒸散は温度にまったく関係しない","蒸散が起こると必ず植物がしおれる"], ex:"水が水蒸気に変わるときには周りから熱をうばうため、蒸散が盛んに行われると植物の体温の上がりすぎを防ぐことができます。"},
      {q:"花の一番外側にあり、つぼみのときに花全体を包んで守っている緑色の部分を何というでしょう。", a:["がく","花びら","おしべ","めしべ"], ex:"花の一番外側にある緑色の部分をがくといい、つぼみのときに花を包んで中を守るはたらきをしています。"},
      {q:"花粉をつくる、おしべの先にある小さな袋のような部分を何というでしょう。", a:["やく","柱頭","子房","胚珠"], ex:"おしべの先にある袋のような部分をやくといい、この中で花粉がつくられます。"},
      {q:"めしべの先にある、花粉がつく部分を何というでしょう。", a:["柱頭","やく","子房","がく"], ex:"めしべの先の部分を柱頭といい、ここに花粉がつくことで受粉が行われます。"},
      {q:"めしべのもとのふくらんだ部分を何というでしょう。", a:["子房","やく","柱頭","がく"], ex:"めしべのもとにあるふくらんだ部分を子房といい、この中に胚珠が入っています。"},
      {q:"子房の中にあり、受精後に種子になる小さな粒を何というでしょう。", a:["胚珠","花粉","柱頭","やく"], ex:"子房の中にある小さな粒を胚珠といい、受精すると成長して種子になります。"},
      {q:"アブラナの花のつくりを外側から順に並べたとき、正しい順番はどれでしょう。", a:["がく、花びら、おしべ、めしべ","花びら、がく、めしべ、おしべ","めしべ、おしべ、花びら、がく","おしべ、めしべ、がく、花びら"], ex:"アブラナの花は外側から、がく、花びら、おしべ、そして中心にめしべの順についています。"},
      {q:"おしべとめしべの両方をもつ花を何というでしょう。", a:["両性花","単性花","無性花","中性花"], ex:"1つの花の中におしべとめしべの両方がある花を両性花といい、アブラナなど多くの植物がこれにあたります。"},
      {q:"おしべでつくられた花粉が、めしべの柱頭につくことを何というでしょう。", a:["受粉","受精","発芽","結実"], ex:"花粉がめしべの柱頭につくことを受粉といい、これが種子や果実ができるための第一段階になります。"},
      {q:"柱頭についた花粉から、胚珠に向かって伸びていく管を何というでしょう。", a:["花粉管","道管","師管","気孔"], ex:"花粉が柱頭につくと花粉管という管を伸ばし、その中を精細胞が通って胚珠まで運ばれます。"},
      {q:"花粉管の中を通って運ばれた精細胞が、胚珠の中の卵細胞と結びつくことを何というでしょう。", a:["受精","受粉","発芽","蒸散"], ex:"精細胞と卵細胞が結びつくことを受精といい、受精した胚珠はやがて種子に成長します。"},
      {q:"受粉から受精までの流れとして正しいものはどれでしょう。", a:["花粉が柱頭につき、花粉管が伸びて精細胞と卵細胞が結びつく","花粉が子房に直接飛びこみ、そのまま種子になる","花粉ができる前に受精が起こる","受精した後に初めて花粉がつくられる"], ex:"まず花粉が柱頭につく受粉が起こり、その後花粉管が胚珠まで伸びて精細胞と卵細胞が結びつく受精が起こります。"},
      {q:"花粉の運ばれ方には、こん虫によるものや風によるものなどがあるが、これらに共通する目的は何でしょう。", a:["花粉を柱頭まで運び受粉を成立させるため","花粉を遠くの土にまくため","花粉を根まで運ぶため","花粉を種子の中に閉じこめるため"], ex:"花粉の運ばれ方はさまざまですが、どれも花粉を同じ種類の花の柱頭まで運び、受粉を成立させるという目的は共通しています。"},
      {q:"自分の花の花粉が、自分のめしべの柱頭につく受粉を何というでしょう。", a:["自家受粉","他家受粉","風媒受粉","虫媒受粉"], ex:"同じ花や同じ株の中で花粉が柱頭につくことを自家受粉といい、エンドウなどに見られます。"},
      {q:"ちがう株の花の花粉が、めしべの柱頭につく受粉を何というでしょう。", a:["他家受粉","自家受粉","無性受粉","単為受粉"], ex:"別の株の花からの花粉が柱頭につくことを他家受粉といい、多くの植物で見られる受粉のしかたです。"},
      {q:"受精が行われた後、子房は成長して何になるでしょう。", a:["果実","種子","花びら","がく"], ex:"受精が終わると子房はふくらんで成長し、やがて果実になります。"},
      {q:"受精が行われた後、胚珠は成長して何になるでしょう。", a:["種子","果実","花びら","根"], ex:"受精した胚珠は成長して種子になり、その中には新しい植物のもとになる胚が入っています。"},
      {q:"アブラナの花で受粉・受精が終わった後、やがて細長いさやのようなものができるが、これは何が成長したものでしょう。", a:["子房","がく","花びら","やく"], ex:"アブラナでは受精後に子房が成長して、種子が入った細長いさやのような果実ができます。"},
      {q:"果実の中に種子ができるのは、どのようなことが行われた結果でしょう。", a:["受粉に続いて受精が行われたこと","花がしおれてしまったこと","花粉がめしべにまったくつかなかったこと","葉が光合成を行ったこと"], ex:"花粉が柱頭につく受粉、その後の受精が行われることで胚珠が種子に、子房が果実に成長していきます。"},
      {q:"受粉した花と受粉しなかった花を比べると、その後のようすにどのようなちがいが見られるでしょう。", a:["受粉した花は果実や種子ができるが、受粉しなかった花はしぼんで落ちやすい","受粉してもしなくても同じように果実ができる","受粉しなかった花の方が大きな果実になる","受粉すると花びらの色だけが変わる"], ex:"受粉が行われないと受精も起こらないため、子房が成長せず、花はやがてしぼんで落ちてしまうことが多くなります。"},
      {q:"種子の中に見られる、成長すると根・茎・葉になる部分をまとめて何というでしょう。", a:["胚","胚乳","子房","がく"], ex:"種子の中には胚とよばれる部分があり、これが発芽した後に根・茎・葉に育っていきます。"},
      {q:"リンゴやナシなどの果実は、主に何が成長してできたものでしょう。", a:["子房(花のもとの部分)","根","茎の先の芽","葉"], ex:"リンゴやナシの果実も、他の多くの植物と同じように、花の中の子房が成長してできたものです。"},
      {q:"こん虫に花粉を運んでもらう花を何というでしょう。", a:["虫媒花","風媒花","水媒花","自家花"], ex:"ミツバチなどのこん虫に花粉を運んでもらう花を虫媒花といい、アブラナやヘチマなどが代表的です。"},
      {q:"風によって花粉が運ばれる花を何というでしょう。", a:["風媒花","虫媒花","水媒花","他家花"], ex:"花粉が風によって運ばれる花を風媒花といい、イネやトウモロコシ、マツなどが代表的です。"},
      {q:"虫媒花に、あざやかな色の花びらや甘いみつ、よい香りがあるのはなぜでしょう。", a:["こん虫を引き寄せて花粉を運んでもらうため","光合成を効率よく行うため","水を効率よく吸収するため","他の植物から身を守るため"], ex:"目立つ色やみつ、香りでこん虫を引き寄せることで、花粉を柱頭まで効率よく運んでもらうことができます。"},
      {q:"風媒花の花粉には、虫媒花の花粉と比べてどのような特徴が見られることが多いでしょう。", a:["軽くて量が多い","重くてねばりけが強い","とても大きくて数が少ない","色があざやかで目立つ"], ex:"風媒花の花粉は風に乗って遠くまで飛ばせるように、軽くて量が多いという特徴があります。"},
      {q:"風媒花であるイネやトウモロコシの花は、虫媒花と比べて花びらのようすにどのようなちがいがあるでしょう。", a:["花びらが目立たず地味なことが多い","花びらがとても大きくあざやかである","花びらの数が虫媒花よりずっと多い","花びらの色が必ず赤色である"], ex:"風媒花はこん虫を引き寄せる必要が少ないため、花びらが小さく地味であることが多いです。"},
      {q:"虫媒花と風媒花のちがいを調べる観点として適切でないものはどれでしょう。", a:["花がさく季節の月の名前","花の色や形、におい","花粉の運ばれ方","花粉のつぶの大きさや量"], ex:"虫媒花と風媒花のちがいは、花のつくりや花粉の運ばれ方、花粉の性質などから調べることができますが、月の名前そのものは直接の観点にはなりません。"},
      {q:"ジャガイモが種子を使わずに、いもから新しい芽を出してふえるようなふえ方を何というでしょう。", a:["栄養生殖","有性生殖","受粉","発芽"], ex:"種子ではなく、いもや茎など植物のからだの一部から新しい個体がふえることを栄養生殖といいます。"},
      {q:"チューリップが土の中の球根から芽を出してふえるのは、どのようなふえ方の例でしょう。", a:["栄養生殖","有性生殖","虫媒による受粉","風媒による受粉"], ex:"チューリップの球根から新しい株が育つのも、種子を使わない栄養生殖の一つの例です。"},
      {q:"植物の茎の一部を切り取って土にさし、根を出させて新しい株を育てる方法を何というでしょう。", a:["さし木","受粉","接ぎ木","種まき"], ex:"茎の一部を土にさして根を出させ、新しい株を育てる方法をさし木といい、栄養生殖の一つです。"},
      {q:"ヤマノイモの葉のつけ根にできる、小さないものようなものを何というでしょう。", a:["むかご","球根","種子","花芽"], ex:"ヤマノイモなどの葉のつけ根にできる小さないものようなものをむかごといい、これが地面に落ちて新しい株に育つことがあります。"},
      {q:"栄養生殖でふえた植物は、もとの植物と比べて性質にどのような特徴があるでしょう。", a:["もとの植物と同じ性質を受けつぎやすい","もとの植物とはまったくちがう新しい性質になる","必ず種子でふえた植物より弱くなる","花のつくりだけが完全に変化する"], ex:"栄養生殖はからだの一部がそのまま新しい個体になるため、もとの植物と同じ性質を受けつぎやすいという特徴があります。"},
      {q:"種子によるふえ方と、栄養生殖によるふえ方の大きなちがいは何でしょう。", a:["受粉や受精を行うかどうか","光合成を行うかどうかのちがい","根が出るかどうかのちがい","葉緑体があるかどうかのちがい"], ex:"種子によるふえ方は花粉による受粉・受精を経て種子ができるのに対し、栄養生殖は受粉や受精を行わずにからだの一部からふえます。"},
      {q:"植物の成長のようすを観察して記録するとき、必ず書いておくとよいことは何でしょう。", a:["観察した日付と天気","観察した人の好きな食べ物","観察に使った筆記用具の種類","観察した場所の住所の郵便番号"], ex:"成長の変化を正しく比べるために、観察した日付や天気、気温などを記録しておくことが大切です。"},
      {q:"植物の観察記録として絵(スケッチ)をかくときに注意することは何でしょう。", a:["実際に見たとおりの形や大きさをできるだけ正確にかく","実際の色とは関係なく好きな色でぬる","観察したものではなく想像で自由にかく","できるだけ細部を省略して速くかく"], ex:"記録のためのスケッチは、後で見ても正しい情報がわかるように、実際に見たとおりの形や大きさを正確にかくことが大切です。"},
      {q:"植物の背の高さの変化を調べるとき、同じ場所で決まった間隔でくり返し何を行うとよいでしょう。", a:["同じ方法で長さを測って記録する","毎回ちがう植物を選んで測る","測るたびに測り方を変える","一度だけ測って終わりにする"], ex:"成長のようすを正しく比べるためには、同じ方法・条件で継続して長さを測り、記録し続けることが大切です。"},
      {q:"インゲンマメの成長を観察するとき、子葉・葉・くきの変化のほかに記録しておくとよいものは何でしょう。", a:["草たけ(植物の高さ)や葉の枚数","近くを通った人の人数","その日のニュースの内容","教室の温度計以外の道具の色"], ex:"植物の成長を数値として比べられるように、草たけや葉の枚数なども記録しておくと変化がわかりやすくなります。"},
      {q:"植物の観察記録をグラフに表すことのよい点は何でしょう。", a:["成長の変化を目で見てわかりやすく比べられる","記録する手間が完全になくなる","観察をしなくてもよくなる","天気の記録が不要になる"], ex:"記録した数値をグラフに表すことで、成長のようすの変化を目で見てひと目で比べやすくなります。"},
      {q:"植物を観察するとき、同じ株を続けて観察することが大切なのはなぜでしょう。", a:["同じ株の変化を追うことで成長のようすを正しく比べられるから","毎回ちがう株を見た方が変化がよくわかるから","同じ株でないと種子ができないから","同じ株の方が花の色が変わりやすいから"], ex:"観察するたびにちがう株を選んでしまうと、個体差によって正しい変化を比べることができなくなってしまいます。"},
      {q:"アブラナの花のなかまで、花びらが4枚あり十字形についている特徴をもつなかまを何というでしょう。", a:["アブラナ科","イネ科","ナス科","マメ科"], ex:"アブラナの花は4枚の花びらが十字形についているのが特徴で、このなかまをアブラナ科といいます。"},
      {q:"ヘチマの花には、おしべだけがある花とめしべだけがある花があるが、これらをそれぞれ何というでしょう。", a:["雄花と雌花","両性花と無性花","虫媒花と風媒花","がく花と柱頭花"], ex:"ヘチマにはおしべだけをもつ雄花と、めしべだけをもつ雌花があり、これらは別々の花としてさきます。"},
      {q:"ヘチマの雌花には、花のもとの部分に他の花にはあまり見られない特徴があるが、それは何でしょう。", a:["花のもとに小さな実(子房)のふくらみが見られる","花びらがまったくない","花の色が必ず白色である","花が夜にしか開かない"], ex:"ヘチマの雌花は花のもとに子房のふくらみが見られ、これが受粉・受精後に成長してヘチマの実になります。"},

      {q:"母親のからだの中である程度育ってから、子として生まれてくる生まれ方を何といいますか。", a:["胎生","卵生","変態","変温"], ex:"母親のおなかの中で栄養をもらいながら育ち、ある程度成長してから生まれる生まれ方を胎生といいます。ほ乳類の多くがこの生まれ方です。"},
      {q:"次の動物のうち、胎生であるものはどれですか。", a:["イヌ","ニワトリ","メダカ","カエル"], ex:"イヌはほ乳類で、母親のおなかの中で育ってから子として生まれる胎生です。ニワトリ・メダカ・カエルはたまごを産む卵生です。"},
      {q:"次の動物のうち、卵生であるものはどれですか。", a:["カエル","ウサギ","ヒト","クジラ"], ex:"カエルは両生類で、たまごを産んでなかまをふやす卵生です。ウサギ・ヒト・クジラはほ乳類で胎生です。"},
      {q:"胎生の動物は、卵生の動物と比べて、生まれる前の子の育ちにどのような特徴がありますか。", a:["母親の体内で守られながら栄養をもらって育つ","母親のからだの外でひとりで育つ","たまごのからの中だけで育つ","水の中でだけ育つ"], ex:"胎生の動物は母親の体内で外敵から守られ、へそのおなどを通して栄養をもらいながら育つため、生まれたときにはある程度成長しています。"},
      {q:"卵生の動物は、一度にたくさんのたまごを産むものが多いのはなぜですか。", a:["たまごや子が外敵に食べられたり育たなかったりすることが多いから","たまごは1つずつしか育たないから","親が長生きできないから","たまごが非常に小さくて数がわからないから"], ex:"卵生の動物のたまごや生まれたばかりの子は外敵に食べられることが多いため、なかまを残すためにたくさんのたまごを産むものが多いです。"},
      {q:"ほ乳類の子は生まれた後、しばらくの間何をもらって育つことが多いですか。", a:["母親の乳","花のみつ","土の中の栄養分","水だけ"], ex:"ほ乳類の子は生まれたあと、母親の乳(母乳)を飲んで育ちます。乳で育てることからほ乳類と呼ばれます。"},
      {q:"サメのなかまには、たまごを産まずに子を産むものがいます。このような生まれ方は、魚類の中では一般的ですか。", a:["いいえ、魚類の多くはたまごを産む卵生です","はい、魚類はすべて子を産む胎生です","魚類にはたまごも子もどちらも存在しません","魚類は分裂してふえます"], ex:"サメのなかまには例外的に子を産む種類もいますが、メダカなど多くの魚類はたまごを産む卵生です。"},
      {q:"ペンギンなど鳥類のなかまは、卵生と胎生のどちらですか。", a:["卵生","胎生","どちらでもない","季節によって変わる"], ex:"鳥類はすべてたまごを産んでひなをかえす卵生です。親鳥がたまごをあたためてひなが生まれます。"},
      {q:"まわりの温度が変わっても、からだの温度をほぼ一定に保つことができる動物を何といいますか。", a:["恒温動物","変温動物","無温動物","低温動物"], ex:"鳥類とほ乳類は恒温動物で、まわりの気温が変化してもからだの中で熱を作り、体温をほぼ一定に保つことができます。"},
      {q:"まわりの温度によって、からだの温度が変化する動物を何といいますか。", a:["変温動物","恒温動物","定温動物","高温動物"], ex:"魚類・両生類・は虫類などは変温動物で、まわりの気温が下がるとからだの温度も下がります。"},
      {q:"次の動物のうち、恒温動物はどれですか。", a:["スズメ","トカゲ","カエル","フナ"], ex:"スズメは鳥類で恒温動物です。トカゲ(は虫類)・カエル(両生類)・フナ(魚類)はすべて変温動物です。"},
      {q:"次の動物のうち、変温動物はどれですか。", a:["ヘビ","ヒト","イヌ","ニワトリ"], ex:"ヘビはは虫類で変温動物です。ヒト・イヌ(ほ乳類)、ニワトリ(鳥類)は恒温動物です。"},
      {q:"カエルなどの変温動物が、冬になると土の中などでじっと動かなくなることを何といいますか。", a:["冬眠","夏眠","変態","脱皮"], ex:"変温動物は気温が下がるとからだの働きも低下するため、冬の間は土の中などでじっとして過ごす冬眠をするものが多くいます。"},
      {q:"変温動物であるトカゲが、日光浴をしてからだを温めているのはなぜですか。", a:["自分でからだの中から熱を作れず、外の熱でからだを温める必要があるから","日光を浴びることで色が変わるから","皮ふをじょうぶにするため","目を良くするため"], ex:"変温動物は自分でからだの中に熱を作るしくみが弱いため、日光を浴びて外から熱をもらい、活動できる体温にしています。"},
      {q:"恒温動物であるほ乳類や鳥類が、寒い冬でも活発に動けるのはなぜですか。", a:["からだの中で熱を作り、体温を一定に保つことができるから","からだの温度が気温と同じに下がるから","冬になるとからだが小さくなるから","冬は食べ物を全くとらないから"], ex:"恒温動物はからだの中で食べ物からとった栄養を使って熱を作り出せるため、まわりが寒くても体温を保って活動できます。"},
      {q:"変温動物と恒温動物を比べたとき、変温動物の体温はどのように変化しますか。", a:["まわりの気温にあわせて上下する","一年中同じ温度に保たれる","気温に関係なく一定に高く保たれる","常に人間の体温と同じになる"], ex:"変温動物には体温を一定に保つしくみがないため、まわりの気温が上がれば体温も上がり、下がれば体温も下がります。"},
      {q:"魚類・両生類・は虫類は、恒温動物と変温動物のどちらに分類されますか。", a:["変温動物","恒温動物","両方の性質を半分ずつ持つ","分類されない"], ex:"魚類・両生類・は虫類はいずれもまわりの温度によって体温が変化する変温動物に分類されます。"},
      {q:"背骨を持つ動物をまとめて何といいますか。", a:["セキツイ動物","無セキツイ動物","軟体動物","節足動物"], ex:"からだの中に背骨を持つ動物をセキツイ動物といい、魚類・両生類・は虫類・鳥類・ほ乳類の5つに分けられます。"},
      {q:"子どものころは水中でえらでこきゅうし、成長すると肺と皮ふでこきゅうするようになる動物のなかまはどれですか。", a:["両生類","魚類","は虫類","鳥類"], ex:"両生類はカエルのように、よう生児(オタマジャクシ)のころはえらでこきゅうし、成体になると肺と皮ふでこきゅうするようになります。"},
      {q:"は虫類のからだの表面は、主にどのようなものでおおわれていますか。", a:["かたいうろこ","しめった皮ふ","羽毛","やわらかい毛"], ex:"は虫類のからだはかたいうろこでおおわれていて、乾燥から身を守るのに役立っています。"},
      {q:"鳥類のからだの表面は、主に何でおおわれていますか。", a:["羽毛","うろこ","毛","しめった皮ふ"], ex:"鳥類のからだは羽毛でおおわれていて、体温を保ったり空を飛んだりするのに役立っています。"},
      {q:"ほ乳類に共通する特徴として正しいものはどれですか。", a:["子を乳で育て、からだが主に毛でおおわれている","たまごを産み、からだがうろこでおおわれている","えらでこきゅうし、水中でしか生きられない","羽毛でおおわれ、くちばしを持つ"], ex:"ほ乳類は母乳で子を育て、からだの多くが毛でおおわれているという特徴があります。"},
      {q:"セキツイ動物5分類のうち、一生を通じて肺でこきゅうし、たまごを陸上に産むなかまはどれですか(ほ乳類を除く)。", a:["は虫類","両生類","魚類","両生類と魚類"], ex:"は虫類は一生を通じて肺でこきゅうし、殻のあるたまごを陸上に産みます。両生類はよう生児のころえらでこきゅうする点が異なります。"},
      {q:"メダカやフナなどの魚類は、セキツイ動物5分類の中でどのなかまに入りますか。", a:["魚類","両生類","は虫類","軟体動物"], ex:"メダカやフナはえらでこきゅうし、うろこでおおわれた魚類のなかまで、セキツイ動物の1つに分類されます。"},
      {q:"カエルやイモリは、セキツイ動物5分類の中でどのなかまに入りますか。", a:["両生類","魚類","は虫類","節足動物"], ex:"カエルやイモリはよう生児のころは水中でえら呼吸、成体になると肺と皮ふでこきゅうする両生類のなかまです。"},
      {q:"トカゲ・ヘビ・カメは、セキツイ動物5分類の中でどのなかまに入りますか。", a:["は虫類","両生類","鳥類","無セキツイ動物"], ex:"トカゲ・ヘビ・カメはかたいうろこにおおわれ、肺でこきゅうするは虫類のなかまです。"},
      {q:"背骨を持たない動物をまとめて何といいますか。", a:["無セキツイ動物","セキツイ動物","変温動物","恒温動物"], ex:"からだの中に背骨がない動物を無セキツイ動物といいます。こん虫やエビ、貝のなかまなどが含まれます。"},
      {q:"こん虫やエビ、カニ、クモのように、からだやあしにいくつもの節があるなかまをまとめて何といいますか。", a:["節足動物","軟体動物","きょく皮動物","は虫動物"], ex:"からだやあしに節(ふし)がある無セキツイ動物のなかまを節足動物といい、こん虫・甲殻類・クモ類などが含まれます。"},
      {q:"エビやカニは、節足動物の中でも特にどのなかまに分類されますか。", a:["甲殻類","こん虫類","クモ類","多足類"], ex:"エビやカニはあしが多く、主に水中で生活する甲殻類という節足動物のなかまです。"},
      {q:"タコやイカ、貝のなかまのように、からだに骨や節がなく、やわらかいなかまをまとめて何といいますか。", a:["軟体動物","節足動物","きょく皮動物","セキツイ動物"], ex:"タコやイカ、貝などのようにからだがやわらかく骨や節がないなかまを軟体動物といいます。"},
      {q:"カタツムリやアサリのなかまは、無セキツイ動物のどの仲間に入りますか。", a:["軟体動物","節足動物","こん虫類","甲殻類"], ex:"カタツムリやアサリはからだがやわらかく、貝がらを持つ軟体動物のなかまです。"},
      {q:"ムカデやヤスデは、節足動物の中でも特にどのなかまに分類されますか。", a:["多足類","甲殻類","こん虫類","クモ類"], ex:"ムカデやヤスデはあしがたくさんある多足類という節足動物のなかまです。こん虫と違いあしの数が多く、頭・胸・腹の分かれ方もちがいます。"},
      {q:"クモは節足動物の中でも特にどのなかまに分類されますか。", a:["クモ類","こん虫類","甲殻類","多足類"], ex:"クモはあしが8本で、からだが頭胸部と腹部の2つに分かれるクモ類という節足動物のなかまです。"},
      {q:"無セキツイ動物には背骨がありませんが、からだを支えるために節足動物はどのようなつくりを持っていますか。", a:["かたい外骨格でからだを支えている","セキツイ動物と同じ背骨を持っている","からだの中に骨がたくさんある","筋肉だけでからだを支えている"], ex:"節足動物は背骨の代わりに、からだの外側をおおうかたい外骨格でからだを支え、守っています。"},
      {q:"貝のなかま(軟体動物)がからだを守るために持っているかたいつくりは何ですか。", a:["貝がら","うろこ","羽毛","外骨格"], ex:"貝のなかまは貝がらという石灰質のかたいからでやわらかいからだを守っています。"},
      {q:"水中で生活する魚類のからだが、細長く流線形をしているのはなぜですか。", a:["水の抵抗を少なくして、泳ぎやすくするため","陸上を歩きやすくするため","空を飛びやすくするため","土の中にもぐりやすくするため"], ex:"魚類のからだは水の抵抗をできるだけ少なくする流線形をしていて、水中を素早く泳ぐのに適しています。"},
      {q:"鳥のからだが羽毛でおおわれ、前あしが翼になっているのは、主にどのような生活に適応したためですか。", a:["空を飛ぶ生活","水中だけで泳ぐ生活","土の中にもぐる生活","木の中を食い進む生活"], ex:"鳥類は空を飛ぶ生活に合わせて、からだが軽い羽毛でおおわれ、前あしが翼へと変化しています。"},
      {q:"モグラの前あしが大きく、シャベルのような形をしているのはなぜですか。", a:["土をほって、土の中で生活するのに都合がよいから","木に登るのに都合がよいから","水の中を泳ぐのに都合がよいから","空を飛ぶのに都合がよいから"], ex:"モグラは土の中でトンネルをほって生活するため、土をほりやすい大きくてじょうぶな前あしを持っています。"},
      {q:"メダカのひれのうち、からだの向きを変えたり、進む方向を安定させたりするのに役立つひれはどれですか。", a:["むなびれとはらびれ","うろこ","えら","口"], ex:"メダカはむなびれやはらびれを使って、からだの向きを変えたりバランスをとったりしながら泳ぎます。"},
      {q:"カエルの後ろあしが大きく発達しているのは、どのような動きに役立っていますか。", a:["ジャンプすることと、水をけって泳ぐこと","空を飛ぶこと","木の幹に穴をあけること","土を深くほること"], ex:"カエルの後ろあしは大きく筋肉が発達していて、陸上でジャンプしたり、水中で強く水をけって泳いだりするのに役立っています。"},
      {q:"アメンボが水面の上を歩くように移動できるのはなぜですか。", a:["あしの先が水をはじきやすいつくりになっていて、水面の張力を利用しているから","からだが非常に軽く、空気中に浮いているから","水面に張ったうすい氷の上を歩いているから","あしから水をふき出して進んでいるから"], ex:"アメンボのあしの先には細かい毛があって水をはじきやすく、水の表面張力を利用して水面に浮くように移動できます。"},
      {q:"空を飛ぶこん虫と、土の中で生活するこん虫のよう虫を比べると、あしの形にどのようなちがいが見られますか。", a:["土の中の虫はほるのに適した太いあしを持つことが多い","空を飛ぶ虫の方が必ずあしが太い","どちらも全く同じあしの形をしている","土の中の虫にはあしがまったくない"], ex:"土の中で生活するこん虫のよう虫は、土をほりやすいように太くてがんじょうなあしを持つものが多く見られます。"},
      {q:"水中と陸上の両方で生活する両生類の皮ふには、どのような特徴がありますか。", a:["しめっていて、皮ふでもこきゅうができる","うろこにおおわれ、乾燥に強い","羽毛でおおわれ、防水性が高い","毛でおおわれ、体温を保ちやすい"], ex:"両生類の皮ふはしめっていて、肺だけでなく皮ふからも空気中の酸素を取り入れることができます。そのため乾燥した場所は苦手です。"},
      {q:"セミの成虫のあしの先には、するどいつめのようなつくりがあります。これは主に何のために役立ちますか。", a:["木の幹などにしっかりとつかまるため","土をほるため","水をかいて泳ぐため","花のみつを吸うため"], ex:"セミの成虫は木の幹にとまって鳴いたり汁を吸ったりして過ごすため、あしの先のつめでしっかりとつかまることができます。"},
      {q:"ライオンなどの肉食動物の歯には、どのような特徴がありますか。", a:["するどい犬歯が発達し、肉を切りさくのに適している","平たい臼歯が多く、草をすりつぶすのに適している","歯がまったくない","歯がすべて同じ形をしている"], ex:"肉食動物はえものの肉をとらえて切りさくために、するどい犬歯や、はさみのような形の歯が発達しています。"},
      {q:"ウマやウシなどの草食動物の歯には、どのような特徴がありますか。", a:["平らな臼歯が発達し、草をすりつぶすのに適している","するどい犬歯が発達し、肉を切りさくのに適している","歯がまったくない","くちばしのような形をしている"], ex:"草食動物はかたい繊維を多く含む草を効率よくすりつぶして食べるため、平らで大きな臼歯が発達しています。"},
      {q:"肉食動物の目が顔の正面に並んでついていることが多いのはなぜですか。", a:["両目で見える範囲を重ねて、えものまでの距離をつかみやすくするため","後ろから来る敵にすぐ気づくため","太陽の光をさけるため","においをよく感じ取るため"], ex:"肉食動物は目が正面に並んでいることで両目の視野が重なり、えものまでの距離を正確につかんでとらえやすくなっています。"},
      {q:"草食動物の目が顔の側面についていることが多いのはなぜですか。", a:["広い範囲を見わたして、敵の接近にいち早く気づくため","えものまでの距離を正確につかむため","夜でもよく見えるようにするため","強い日差しから目を守るため"], ex:"草食動物は目が側面にあることで広い範囲を見わたすことができ、肉食動物などの敵が近づいてくるのにいち早く気づくことができます。"},
      {q:"カマキリの前あしが、ほかのあしと違ってかまのような形をしているのはなぜですか。", a:["ほかの虫をとらえて食べるのに都合がよいから","土をほるのに都合がよいから","水をかいて泳ぐのに都合がよいから","花のみつを吸うのに都合がよいから"], ex:"カマキリは肉食のこん虫で、前あしがかまのような形に発達していて、えものをすばやくとらえるのに役立っています。"},
      {q:"バッタの口のつくりは、草の葉を食べるのにどのように適していますか。", a:["葉をかみ切るのに適したあごを持っている","みつを吸うストローのような口を持っている","肉を切りさくきばを持っている","口が退化してまったくない"], ex:"バッタは草食のこん虫で、じょうぶなあごを使って草の葉をかみ切って食べます。"},

      {q:"太平洋側で夏に雨が多く、冬に晴れの日が多いのはなぜか。", a:["夏と冬で季節風の向きが変わるから","台風が来ないから","海流が止まるから","気圧が一定だから"], t:"しくみ", ex:"夏は南東の湿った季節風、冬は北西の乾いた季節風がふくため、季節によって天気の傾向が変わる。"},
      {q:"雲が長い時間ほとんど動かず、雨が降り続く梅雨の時期にできる前線を何というか。", a:["停滞前線(梅雨前線)","寒冷前線","温暖前線","閉塞前線"], ex:"停滞前線は暖気と寒気の勢力がつり合ってほとんど動かない前線で、長雨の原因になる。"},
      {q:"晴れた日と雨の日で、一日の気温の変化が大きいのはどちらか。", a:["晴れた日","雨の日","どちらも同じ","変化しない"], ex:"晴れの日は日光がよく当たるため昼の気温が高くなり、夜は熱がにげやすく気温が下がるため、気温差が大きい。"},
      {q:"気象情報で「明日は西から天気が下り坂」と言われる理由は何か。", a:["低気圧や前線が西からやってくるから","東から高気圧が来るから","台風が去ったから","季節風が止むから"], t:"しくみ", ex:"日本付近では雲や気圧配置が偏西風に乗って西から東へ移動することが多いため。"},
      {q:"雨を降らせる代表的な、空全体に広がる灰色っぽい雲を何というか", a:["乱層雲","巻雲","高積雲","巻積雲"], ex:"乱層雲は雨や雪を降らせる灰色っぽい雲で、空全体に広がることが多いです。"},
      {q:"もくもくと盛り上がり、夏によく見られる入道雲の正式名称は何か", a:["積乱雲","層雲","巻雲","高層雲"], ex:"積乱雲は入道雲とも呼ばれ、強い上昇気流によって発達し、雷や激しい雨をもたらします。"},
      {q:"空の高いところにできる、はけで描いたような白いすじ雲を何というか", a:["巻雲","積雲","層積雲","乱層雲"], ex:"巻雲は氷のつぶでできていて、天気が変わる前ぶれとして見られることがあります。"},
      {q:"晴れた日にぽっかり浮かぶ、わたのような形の雲を何というか", a:["積雲","乱層雲","高層雲","巻層雲"], ex:"積雲は晴れた日によく見られる雲で、大きく発達すると積乱雲になることがあります。"},
      {q:"空全体を灰色におおい、太陽の光をさえぎる低い層状の雲を何というか", a:["層雲","巻積雲","積雲","高積雲"], ex:"層雲は霧のように低い場所にできることが多く、空をどんよりと覆います。"},
      {q:"台風が近づくと見られることがある、うすく空全体に広がり太陽にかさをつくる雲は何か", a:["巻層雲","積雲","層雲","乱層雲"], ex:"巻層雲はうすく空全体に広がる雲で、太陽や月にかさ(輪)がかかって見えることがあります。"},
      {q:"魚のうろこのように小さな雲がたくさん並んで見える雲を何というか", a:["巻積雲","積乱雲","層雲","乱層雲"], ex:"巻積雲は「うろこ雲」や「いわし雲」とも呼ばれ、天気が下り坂に向かうサインとされます。"},
      {q:"空の高いところに広がる、うすくて灰色っぽく太陽がぼんやり見える雲を何というか", a:["高層雲","積雲","巻雲","層積雲"], ex:"高層雲は空全体を覆うように広がり、雨の前に見られることが多い雲です。"},
      {q:"雲について正しく説明しているのはどれか", a:["雲は小さな水や氷のつぶが集まってできている","雲はすべて同じ高さにできる","雲は必ず雨を降らせる","雲は地面から浮き上がった土でできている"], ex:"雲は空気中の水蒸気が冷やされてできた小さな水や氷のつぶの集まりです。"},
      {q:"空全体を10としたとき、雲の量が0~1のときの天気は何か", a:["快晴","くもり","晴れ","雨"], ex:"雲量が0や1のとき、空はほとんど雲がない状態で快晴とよびます。"},
      {q:"空全体を10としたとき、雲の量が2~8のときの天気は何か", a:["晴れ","快晴","くもり","雨"], ex:"雲量が2から8のときは晴れとされ、日本ではこの範囲が最も多く使われる区分です。"},
      {q:"空全体を10としたとき、雲の量が9~10のときの天気は何か", a:["くもり","晴れ","快晴","雨"], ex:"雲量が9や10のように空がほとんど雲でおおわれているとき、天気はくもりになります。"},

      {q:"雲量を観測するときの正しい方法はどれか", a:["空全体を見わたして雲がしめる割合を目で見て判断する","雨量計を使って測る","温度計を使って測る","風向計を使って測る"], ex:"雲量は観測する人が空全体を見わたし、雲がどれくらいの割合を占めているかを目で見て判断します。"},
      {q:"快晴とくもりのちがいを正しく説明しているのはどれか", a:["快晴は雲がほとんどなく、くもりは空のほとんどが雲でおおわれている","快晴は雨が降らず、くもりは必ず雨が降る","快晴は気温が高く、くもりは気温が低い","快晴は風がなく、くもりは風が強い"], ex:"快晴とくもりの違いは雲の量によるもので、気温や風の強さで決まるわけではありません。"},
      {q:"まわりより気圧が高いところを何というか", a:["高気圧","低気圧","前線","台風"], ex:"まわりより気圧が高いところを高気圧といい、一般に天気が良くなることが多いです。"},
      {q:"まわりより気圧が低いところを何というか", a:["低気圧","高気圧","移動性高気圧","熱帯低気圧のなかま"], ex:"まわりより気圧が低いところを低気圧といい、雲ができやすく天気が悪くなることが多いです。"},
      {q:"高気圧の中心付近では、空気はどのように動くか", a:["下降気流が生じ、雲ができにくい","上昇気流が生じ、雲ができやすい","空気はまったく動かない","空気が真横にだけ流れる"], ex:"高気圧の中心では空気が下向きに流れる下降気流が生じるため、雲ができにくく晴れることが多いです。"},
      {q:"低気圧の中心付近では、空気はどのように動くか", a:["上昇気流が生じ、雲ができやすい","下降気流が生じ、雲ができにくい","空気はまったく動かない","空気が真横にだけ流れる"], ex:"低気圧の中心では空気が上向きに流れる上昇気流が生じるため、雲ができやすく天気が悪くなりやすいです。"},

      {q:"一般的に、高気圧におおわれた地域の天気の特徴として正しいのはどれか", a:["晴れることが多い","雨になることが多い","必ず台風が来る","気温が急に下がる"], ex:"高気圧の中心付近では下降気流によって雲ができにくいため、晴れることが多くなります。"},
      {q:"移動性高気圧とはどのようなものか", a:["大陸などで発生し、東へ向かって移動していく高気圧","一年中同じ場所にとどまり続ける高気圧","台風が弱まってできる高気圧","海の上だけにできる高気圧"], ex:"移動性高気圧は春や秋によく見られ、日本列島を西から東へ通過しながら晴れをもたらします。"},

      {q:"冷たい空気が暖かい空気の下にもぐりこみ、暖かい空気を急激に押し上げてできる前線は何か", a:["寒冷前線","温暖前線","停滞前線","閉塞前線"], ex:"寒冷前線は冷たい空気が暖かい空気の下に急にもぐりこんでできる前線で、強い雨を短時間降らせることが多いです。"},
      {q:"暖かい空気が冷たい空気の上にはい上がるようにして進む前線は何か", a:["温暖前線","寒冷前線","停滞前線","閉塞前線"], ex:"温暖前線は暖かい空気が冷たい空気の上をゆるやかにはい上がる前線で、広い範囲に弱い雨を長く降らせます。"},

      {q:"寒冷前線が通過したあとの気温の変化として正しいのはどれか", a:["気温が急に下がることが多い","気温が急に上がることが多い","気温はまったく変化しない","気温が一日かけてゆっくり上がる"], ex:"寒冷前線が通過すると冷たい空気に入れかわるため、気温が急に下がることが多いです。"},
      {q:"温暖前線が近づくとき、天気はどのように変化することが多いか", a:["広い範囲でしとしとと弱い雨が長く降る","短時間に激しい雷雨が降る","雲ひとつない快晴が続く","急に強い風がふいてすぐやむ"], ex:"温暖前線では暖かい空気がゆるやかに上昇するため、広い範囲に弱い雨が長時間降ることが多いです。"},
      {q:"天気図の前線記号のうち、寒冷前線の特徴として正しいのはどれか", a:["進む向きに三角形の印がついている","進む向きに半円の印がついている","三角形と半円が両側についている","記号は何もつかない直線である"], ex:"寒冷前線は進む方向に三角形の印がついた線で表され、温暖前線は半円の印で表されます。"},
      {q:"前線ができる主な原因は何か", a:["性質の異なる暖かい空気と冷たい空気がぶつかること","気温が一年中変化しないこと","海と陸の高さが同じであること","太陽の光がまったく当たらないこと"], ex:"前線は性質の異なる暖気と寒気の境目にでき、そこでは雲ができやすく天気が変わりやすくなります。"},

      {q:"台風は一般的にどのような進路をとることが多いか", a:["はじめは西へ進み、その後北や東寄りに進路を変える","常に真南だけに向かって進む","一年中ほとんど同じ場所にとどまる","必ず北から南へ進む"], ex:"台風は太平洋高気圧のふちに沿って西へ進んだあと、偏西風の影響を受けて北や東へ進路を変えることが多いです。"},
      {q:"台風によっておこる被害として当てはまらないものはどれか", a:["大雪による交通まひ","強い暴風による被害","大量の雨による洪水","高潮による浸水"], ex:"台風は暖かい季節に発達するため大雪ではなく、暴風・大雨・高潮などの被害をもたらします。"},

      {q:"台風が日本に近づく時期として最も多いのはいつごろか", a:["夏から秋(7月~10月ごろ)","真冬(1月~2月ごろ)","早春(3月ごろ)","一年を通してまったく差がない"], ex:"台風は海水温が高くなる夏から秋にかけて発生数が増え、日本に近づきやすくなります。"},
      {q:"台風のエネルギー源となっているものは何か", a:["暖かい海から蒸発する水蒸気が水に変わるときに出す熱","太陽の光を直接反射する熱","火山からふき出す熱","地面にたまった熱だけ"], ex:"台風は暖かい海面から蒸発した水蒸気が雲になるときに放出する熱をエネルギーとして発達します。"},
      {q:"台風の風のふき方について正しいのはどれか", a:["中心に向かって反時計回りにふきこむ","中心から時計回りにふき出す","中心に向かって時計回りにふきこむ","風は中心を避けてまっすぐふく"], ex:"台風は低気圧の一種で、北半球では中心に向かって反時計回りに風がふきこみます。"},

      {q:"冬に北西の季節風が日本海を渡るとき、風にどのような変化が起こるか", a:["海から水分を吸収してしめった風に変わる","完全にかわいた風のまま変わらない","風向きが逆になる","風の温度が急に高くなる"], ex:"冷たく乾いた風が日本海の上を渡るときに海から水分を吸収し、しめった雪雲を作るもとになります。"},
      {q:"冬の季節風の影響で、日本海側と太平洋側の天気にはどのようなちがいが出るか", a:["日本海側は雪や雨が多く、太平洋側は乾燥した晴れの日が多い","日本海側は晴れが多く、太平洋側は雪が多い","両方とも同じように雪が多い","両方とも一年中晴れが続く"], ex:"山脈をこえるときに水分を落とすため、日本海側は雪、山をこえた太平洋側は乾いた晴れの日になりやすいです。"},

      {q:"夏に日本で南東の季節風がふく主な理由は何か", a:["海洋上の高気圧と大陸の低気圧の気圧差","台風がいつも同じ場所を通るから","偏西風が弱まるから","北極の氷がとけるから"], ex:"夏は大陸があたたまって気圧が低くなり、海洋上の高気圧から大陸へ向けて南東の季節風がふきます。"},

      {q:"夏の季節風によって太平洋側の地域にもたらされる天気の特徴はどれか", a:["しめった空気により蒸し暑く、雨も多くなりやすい","乾燥してさらさらした暑さになる","雪が多く降るようになる","一年で最も涼しい時期になる"], ex:"夏の南東の季節風は海の水分を多くふくむため、太平洋側では蒸し暑く雨の多い天気になりやすいです。"},
      {q:"空気中にふくまれる水蒸気の割合を表すものを何というか", a:["湿度","気圧","気温","風速"], ex:"湿度は空気中にどれくらいの水蒸気がふくまれているかを百分率(%)で表したものです。"},
      {q:"空気が冷やされて、ふくみきれなくなった水蒸気が水てきに変わり始める温度を何というか", a:["露点","沸点","融点","気温"], ex:"露点は空気中の水蒸気が水てきに変わり始める温度で、湿度が高いほど露点は気温に近くなります。"},

      {q:"太陽の表面に見られる、まわりよりも温度が低く暗く見える部分を何というか。", a:["黒点","プロミネンス","コロナ","皆既日食"], ex:"黒点は太陽の活動の様子を知る手がかりになり、数や位置は少しずつ変化する。"},
      {q:"太陽の高さが1年でいちばん高くなる日を何というか。", a:["夏至","冬至","春分","秋分"], ex:"夏至の日は南中高度が最も高くなり、昼の長さも1年でいちばん長くなる。"},
      {q:"太陽の高さが1年でいちばん低くなる日を何というか。", a:["冬至","夏至","春分","秋分"], ex:"冬至の日は南中高度が最も低くなり、昼の長さも1年でいちばん短くなる。"},
      {q:"太陽は1日のうちで、どの方角からのぼりますか。", a:["東","西","南","北"], ex:"太陽は東の空からのぼり、南の空を通って西にしずみます。"},
      {q:"太陽が1日のうちで最も高くなるのは、どの方角の空にあるときですか。", a:["南","東","西","北"], ex:"太陽は正午ごろ、南の空でいちばん高くなります。これを南中といいます。"},
      {q:"晴れた日の正午ごろ、日本で棒を地面に立てると、かげはどの方角にできますか。", a:["北","南","東","西"], ex:"太陽が南の空でいちばん高くなるとき、かげは太陽と反対の北にできます。"},
      {q:"1日の中で、かげが最も短くなるのはいつごろですか。", a:["正午ごろ","朝早く","夕方","真夜中"], ex:"太陽がいちばん高くなる正午ごろ、かげはいちばん短くなります。"},
      {q:"太陽が動いて見えるのは、実際には何が動いているからですか。", a:["地球が自転しているから","太陽が地球の周りを回っているから","月が地球の周りを回っているから","星が動いているから"], ex:"太陽は動いていません。地球が西から東へ自転しているために、太陽が東からのぼり西にしずむように見えるのです。"},
      {q:"太陽が西にしずむころ、かげはどの方角にのびますか。", a:["東","西","南","北"], ex:"太陽が西にあるとき、かげは太陽と反対の東の方角に長くのびます。"},
      {q:"1日の中で、太陽の高さと気温の変化について正しいのはどれですか。", a:["太陽が南中したあと、少しおくれて気温が最も高くなる","太陽が南中すると同時に気温が最も高くなる","太陽の高さと気温は関係がない","朝いちばん気温が高くなる"], ex:"地面があたたまるのに時間がかかるため、太陽が南中する正午ごろより少しおくれて、午後2時ごろに気温が最も高くなります。"},
      {q:"日時計は何を利用して時こくを知る道具ですか。", a:["太陽の動きによってできるかげの向き","月の満ち欠け","星の明るさ","風の向き"], ex:"日時計は、太陽の動きにつれてかげの向きが変わることを利用して、時こくを読み取る道具です。"},
      {q:"太陽が真東からのぼり真西にしずむ日はどれですか。", a:["春分と秋分の日","夏至の日","冬至の日","1年のどの日でも同じ"], ex:"春分と秋分の日には、太陽は真東からのぼって真西にしずみます。"},
      {q:"1年のうちで、太陽の南中高度がいちばん高くなる日を何といいますか。", a:["夏至","冬至","春分","秋分"], ex:"夏至の日は太陽が南の空でいちばん高くまで上がり、昼の長さも1年でいちばん長くなります。"},
      {q:"1年のうちで、太陽の南中高度がいちばん低くなる日を何といいますか。", a:["冬至","夏至","春分","秋分"], ex:"冬至の日は太陽の高さが1年でいちばん低くなり、昼の長さも1年でいちばん短くなります。"},
      {q:"昼と夜の長さがほぼ同じになる日はいつですか。", a:["春分と秋分の日","夏至と冬至の日","元日","毎月1日"], ex:"春分と秋分の日は、昼と夜の長さがほぼ同じになります。"},
      {q:"夏至の日について正しいのはどれですか。", a:["1年でいちばん昼が長い","1年でいちばん昼が短い","1年でいちばん寒い","昼と夜の長さが同じ"], ex:"夏至の日は太陽が高く長い時間空にあるため、1年でいちばん昼が長くなります。"},
      {q:"冬至の日について正しいのはどれですか。", a:["1年でいちばん昼が短い","1年でいちばん昼が長い","1年でいちばん暑い","昼と夜の長さが同じ"], ex:"冬至の日は太陽の高さが低く空にある時間も短いため、1年でいちばん昼が短くなります。"},
      {q:"太陽の高さが季節によって変わる主な理由は何ですか。", a:["地球が地じくをかたむけたまま太陽の周りを回っているから","太陽の大きさが変わるから","地球と太陽のきょりが大きく変わるから","月の位置が変わるから"], ex:"地球は地じくをかたむけたまま公転しているため、季節によって太陽の光の当たり方が変わり、南中高度も変化します。"},
      {q:"夏に気温が高くなる理由として正しいものはどれですか。", a:["太陽の高さが高く、日光が地面に強く当たり昼も長いから","地球と太陽のきょりが近くなるから","月の光が強くなるから","風の向きが変わるだけだから"], ex:"夏は太陽の南中高度が高くなり、日光がより強く地面に当たるうえ昼の時間も長いため、気温が上がります。"},
      {q:"春分の日の太陽の動き方について正しいのはどれですか。", a:["真東からのぼり真西にしずむ","北寄りの東からのぼる","南寄りの東からのぼる","1日中しずまない"], ex:"春分の日は、太陽がほぼ真東からのぼり真西にしずみます。"},
      {q:"夏至のころ、太陽がのぼる方角として正しいのはどれですか。", a:["真東より北寄り","真東より南寄り","真西","真南"], ex:"夏至のころは、太陽は真東よりも北寄りの方角からのぼります。"},
      {q:"地球が1日に1回、じくを中心にくるっと回ることを何といいますか。", a:["自転","公転","回転運動","周期運動"], ex:"地球がじく(地じく)を中心に1日1回転することを自転といいます。"},
      {q:"地球が1年かけて太陽の周りを1周することを何といいますか。", a:["公転","自転","周回","天体運動"], ex:"地球が太陽の周りを1年かけて1周することを公転といいます。"},
      {q:"地球の自転の向きはどちらですか。", a:["西から東","東から西","北から南","南から北"], ex:"地球は西から東へ自転しています。そのため太陽や星が東からのぼり西にしずむように見えます。"},
      {q:"昼と夜ができる理由は何ですか。", a:["地球が自転しているから","地球が公転しているから","太陽が地球の周りを回っているから","月が地球をかくすから"], ex:"地球が自転することで、太陽に面している側が昼、反対側が夜になります。"},
      {q:"季節が変化する主な理由は何ですか。", a:["地球が地じくをかたむけたまま公転しているから","地球が自転しているから","太陽の明るさが変わるから","月の形が変わるから"], ex:"地球は地じくをかたむけたまま太陽の周りを公転しているため、季節によって太陽の光の当たり方が変わります。"},
      {q:"地球が1回自転するのにかかる時間はおよそどれくらいですか。", a:["1日（24時間）","1週間","1か月","1年"], ex:"地球は1日、つまりおよそ24時間で1回自転しています。"},
      {q:"地球が1回公転するのにかかる時間はおよそどれくらいですか。", a:["1年（約365日）","1日","1か月","10年"], ex:"地球は太陽の周りを1周するのに、およそ365日、つまり1年かかります。"},
      {q:"自転と公転のちがいを正しく説明しているのはどれですか。", a:["自転は地球自身が回ること、公転は太陽の周りを回ること","自転も公転も同じ動きのこと","自転は太陽が回ること、公転は月が回ること","自転は1年、公転は1日でおこなわれる動き"], ex:"自転は地球自身がじくを中心に回る動き、公転は地球が太陽の周りを回る動きで、それぞれ別の動きです。"},
      {q:"地球の地じくは、公転面に対しておよそ何度かたむいていますか。", a:["約23.4度","約90度","約45度","かたむいていない"], ex:"地球の地じくは公転面に対して約23.4度かたむいており、このかたむきが季節の変化を生み出します。"},
      {q:"月がまったく見えない状態を何といいますか。", a:["新月","満月","半月","三日月"], ex:"太陽の光が当たっている面がすべて地球から見えない向きになると、月は見えなくなり、これを新月といいます。"},
      {q:"細い月がゆう方の西の空に見える、新月から数日後の月を何といいますか。", a:["三日月","満月","新月","下弦の月"], ex:"新月から3日ほどたつと、細長い形の三日月が見えるようになります。"},
      {q:"月全体が丸く明るく見える状態を何といいますか。", a:["満月","新月","三日月","半月"], ex:"太陽の光を受けた面がすべて地球から見えるようになると、月は丸い満月に見えます。"},
      {q:"右半分が光って見える半月を何といいますか。", a:["上弦の月","下弦の月","満月","新月"], ex:"新月から満月に向かう間に見える、右半分が光る半月を上弦の月といいます。"},
      {q:"月の形が変わって見える理由は何ですか。", a:["太陽・月・地球の位置関係が変わり、光る部分の見え方が変わるから","月自体の形が変化するから","月が大きくなったり小さくなったりするから","地球のかげが月を毎日少しずつかくすから"], ex:"月は自分で光っておらず、太陽の光を受けてかがやいています。太陽・月・地球の位置関係が変わることで、光って見える部分の形がちがって見えるのです。"},
      {q:"月が満ち欠けをくり返す周期はおよそどれくらいですか。", a:["約29.5日","約7日","約100日","約365日"], ex:"月は新月から次の新月まで、およそ29.5日かけて満ち欠けをくり返します。"},
      {q:"月はいつも地球に同じ面を向けています。その理由として正しいのはどれですか。", a:["月の自転周期と公転周期がほぼ同じだから（約27.3日）","月が自転していないから","地球が月を固定しているから","月には裏側がないから"], ex:"月は自転する周期と地球の周りを公転する周期がほぼ同じ（約27.3日）なので、いつも同じ面を地球に向けています。"},
      {q:"新月から満月になるまでの月の見え方の順番として正しいのはどれですか。", a:["新月→三日月→上弦の月→満月","新月→満月→三日月→上弦の月","満月→上弦の月→三日月→新月","新月→下弦の月→満月→三日月"], ex:"月は新月のあと、三日月、上弦の月と少しずつ光る部分が増えていき、やがて満月になります。"},
      {q:"月が光って見えるのはなぜですか。", a:["太陽の光を反射しているから","月自体が光を出しているから","地球の光を反射しているから","星の光を集めているから"], ex:"月は自分で光を出さず、太陽の光を反射することでかがやいて見えています。"},
      {q:"太陽・月・地球が一直線に並び、月が太陽をかくしてしまう現象を何といいますか。", a:["日食","月食","満月","新月"], ex:"太陽と地球の間に月が入り、太陽をかくすように見える現象を日食といいます。"},
      {q:"太陽・地球・月が一直線に並び、地球のかげが月にうつる現象を何といいますか。", a:["月食","日食","新月","三日月"], ex:"地球が太陽と月の間に入り、地球のかげが月にうつって欠けて見える現象を月食といいます。"},
      {q:"日食が起こるのは、月がどのような状態のときですか。", a:["新月のとき","満月のとき","上弦の月のとき","下弦の月のとき"], ex:"日食は太陽・月・地球がこの順に並ぶ新月のときに起こる現象です。"},
      {q:"月食が起こるのは、月がどのような状態のときですか。", a:["満月のとき","新月のとき","三日月のとき","半月のとき"], ex:"月食は太陽・地球・月がこの順に並ぶ満月のときに起こる現象です。"},
      {q:"新月のたびに毎回日食が起こらないのはなぜですか。", a:["月の通り道（公転面）が地球の公転面から少しかたむいているから","月が太陽より大きいから","太陽が動かないから","地球が自転していないから"], ex:"月が地球の周りを回る通り道は、地球が太陽の周りを回る通り道から少しかたむいているため、新月のたびにぴったり一直線には並ばず、日食は毎回は起こりません。"},
      {q:"皆既日食のとき、太陽はどのように見えますか。", a:["月にすっかりかくされ、周りだけがぼんやり見える","いつもより明るく見える","大きくふくらんで見える","色が青く変わる"], ex:"皆既日食では月が太陽全体をかくすため、太陽の中心部分が見えなくなり、まわりの光だけがうっすら見えます。"},
      {q:"皆既月食のとき、月が赤黒く見えることがあるのはなぜですか。", a:["地球の大気を通ったわずかな光が月にとどくから","月が燃えているから","太陽の光が強すぎるから","月の表面の色が変わるから"], ex:"皆既月食では、地球の大気で曲げられた赤っぽい光がわずかに月にとどくため、月が赤黒く見えることがあります。"},
      {q:"日食と月食のうち、太陽が欠けて見えるのはどちらですか。", a:["日食","月食","どちらも太陽が欠ける","どちらも月が欠ける"], ex:"日食は月が太陽をかくす現象なので、地球から見ると太陽が欠けて見えます。"},
      {q:"日食と月食のうち、地球のかげが関係しているのはどちらですか。", a:["月食","日食","どちらも関係する","どちらも関係しない"], ex:"月食は地球が太陽と月の間に入り、地球のかげが月にうつることで起こります。"},
      {q:"星が1日のうちで東からのぼり西にしずむように見える動きを何といいますか。", a:["星の日周運動","星の年周運動","星の自転","星の公転"], ex:"地球が自転しているため、星は太陽と同じように東からのぼり西にしずむように見えます。これを星の日周運動といいます。"},
      {q:"星が1年をかけて同じ時こくに見える位置が少しずつ変わっていく動きを何といいますか。", a:["星の年周運動","星の日周運動","星の自転","星の公転"], ex:"地球が太陽の周りを公転しているため、同じ時こくに見える星の位置は1年かけて少しずつ変わります。これを星の年周運動といいます。"},
      {q:"星の日周運動が起こる理由は何ですか。", a:["地球が自転しているから","地球が公転しているから","星がそれぞれ動いているから","太陽が動いているから"], ex:"地球が西から東へ自転しているため、星は東からのぼり西へしずむように見えます。"},
      {q:"星の年周運動が起こる理由は何ですか。", a:["地球が太陽の周りを公転しているから","地球が自転しているから","星の明るさが変わるから","月が星をかくすから"], ex:"地球が太陽の周りを1年かけて公転しているため、季節によって見える星座や星の位置が変わります。"},
      {q:"同じ星を毎日同じ時こくに観察すると、見える位置はどのように変わりますか。", a:["1日あたり約1度、東から西へ動いて見える","1日あたり約1度、西から東へ動いて見える","1日で空を1周してしまう","見える位置はランダムに変わる"], ex:"地球の公転によって、同じ時こくに見える星の位置は1日に約1度ずつ、東から西へ動いていくように見えます。"},
      {q:"北の空の星は、南の空の星と比べてどのように動いて見えますか。", a:["北極星を中心にほぼ円をえがくように動く","まったく動かない","南の空の星と同じ向きに一直線に動く","西から東へまっすぐ動く"], ex:"北の空の星は、ほぼ動かない北極星を中心にして、反時計回りに円をえがくように動いて見えます。"},
      {q:"星が1時間にどれくらいの角度動いて見えますか。", a:["約15度","約1度","約30度","約90度"], ex:"星は1日（24時間）で空をほぼ1周（約360度）するので、1時間あたりでは約15度動いて見えます。"},
      {q:"冬に見えていた星座が夏には見えなくなるのはなぜですか。", a:["地球の公転によって、夜に見える方角の星座が変わるから","星座が消えてしまうから","冬の間だけ星が光るから","星座が地球に近づいたり遠ざかったりするから"], ex:"地球が太陽の周りを公転することで、夜に太陽と反対側にくる星座が季節ごとに変わるため、見える星座も変わっていきます。"},
      {q:"星の年周運動によって、同じ星座が同じ時こくに見える時期はいつですか。", a:["1年後のほぼ同じ時期","1か月後","1週間後","1日後"], ex:"星の年周運動は地球の公転（1年）によるものなので、同じ星座が同じ時こくに見えるのは、約1年後のほぼ同じ時期になります。"},
      {q:"こと座のベガ、わし座のアルタイル、はくちょう座のデネブの3つの星を結んでできる形を何といいますか。", a:["夏の大三角","冬の大三角","春の大三角","秋の四辺形"], ex:"夏の夜空に見えるベガ、アルタイル、デネブという3つの明るい星を結んだ形を夏の大三角といいます。"},
      {q:"おおいぬ座のシリウス、こいぬ座のプロキオン、オリオン座のベテルギウスの3つの星を結んでできる形を何といいますか。", a:["冬の大三角","夏の大三角","春の大三角","秋の四辺形"], ex:"冬の夜空に見えるシリウス、プロキオン、ベテルギウスという3つの明るい星を結んだ形を冬の大三角といいます。"},
      {q:"冬の夜空によく見られ、三つ星が特ちょうの星座はどれですか。", a:["オリオン座","さそり座","はくちょう座","こと座"], ex:"オリオン座は冬の代表的な星座で、まん中に3つ並んだ三つ星が目印です。"},
      {q:"夏の南の空に見られ、S字のような形をしていて赤い一等星アンタレスをもつ星座はどれですか。", a:["さそり座","オリオン座","おおぐま座","カシオペヤ座"], ex:"さそり座は夏の代表的な星座で、S字に曲がった体の中に赤くかがやく一等星アンタレスがあります。"},
      {q:"夜空全体で最も明るく見える恒星で、おおいぬ座にふくまれる星はどれですか。", a:["シリウス","ベガ","アンタレス","北極星"], ex:"シリウスはおおいぬ座にある星で、全天の恒星の中で最も明るく見えます。"},

      {q:"れき岩・砂岩・でい岩を区別するときの主な基準は何か", a:["つぶの大きさ","岩石の色","岩石のかたさだけ","できた年代"], ex:"れき岩・砂岩・でい岩は、それぞれをつくるつぶの大きさのちがいによって区別されます。"},
      {q:"地層ができた当時の環境を知る手がかりになる化石を何というか", a:["示相化石","示準化石","標準化石","化石燃料"], ex:"生物が限られた環境でしか生きられない性質を利用し、当時の環境を推定できる化石を示相化石といいます。"},
      {q:"サンゴの化石が地層から見つかったとき、その地層ができた当時の環境として考えられるのはどれか", a:["あたたかく浅い海","冷たく深い海","寒い陸地","高い山の上"], ex:"サンゴはあたたかく浅い海にしかすめないため、その化石はあたたかい浅い海であったことを示します。"},
      {q:"地層ができた時代を知る手がかりになる化石を何というか", a:["示準化石","示相化石","生痕化石","木の化石"], ex:"広い範囲で短い期間だけ栄えた生物の化石は、地層ができた時代を知る手がかりになるので示準化石といいます。"},
      {q:"アンモナイトの化石が見つかった地層は、どの時代にできたと考えられるか", a:["中生代","古生代","新生代","先カンブリア時代"], ex:"アンモナイトは中生代に広く栄えて絶滅した生物なので、その化石は地層が中生代にできたことを示す示準化石です。"},
      {q:"示準化石として役立つ生物の条件として正しいものはどれか", a:["広い範囲に分布し、限られた時代にだけ栄えたこと","せまい範囲にしか生息せず長期間栄えたこと","現在も生きていること","化石にならないこと"], ex:"広い地域に分布し、短い期間だけ栄えて絶滅した生物ほど、地層の時代を正確に決める手がかりになります。"},
      {q:"シジミの化石が見つかった地層からわかる当時の環境として適切なものはどれか", a:["河口や湖など淡水と海水が混じる場所","深い海の底","高い山の上","砂ばくのような乾燥した陸地"], ex:"シジミは河口や湖など淡水と海水が混じり合う場所にすむため、その化石は当時そのような環境だったことを示します。"},
      {q:"地層から見つかる化石は主に何がもとになってできるか", a:["大昔の生物の死がいや生活のあと","火山灰が固まったもの","川原の石が変化したもの","地震で割れた岩石"], ex:"化石は大昔の生物の体や、生活したあと(足あとなど)が地層の中に残されてできたものです。"},
      {q:"化石が地層の中に残るために必要な条件として適切なものはどれか", a:["すぐに土砂におおわれて空気にふれにくくなること","すぐに強い日光に当たること","すぐに海水で洗われること","すぐに燃えてしまうこと"], ex:"生物の死がいがすぐに土砂におおわれると腐りにくくなり、化石として残りやすくなります。"},
      {q:"マグマが地表や地表近くで急に冷えて固まってできた岩石を何というか", a:["火山岩","深成岩","たい積岩","変成岩"], ex:"マグマが地表付近で急速に冷やされて固まった岩石を火山岩といいます。"},
      {q:"マグマが地下深くでゆっくり冷えて固まってできた岩石を何というか", a:["深成岩","火山岩","れき岩","ぎょう灰岩"], ex:"マグマが地下深くで長い時間をかけてゆっくり冷え固まると、深成岩ができます。"},
      {q:"火山岩に見られる、小さな結晶(石基)の中に大きな結晶(斑晶)が散らばったつくりを何というか", a:["斑状組織","等粒状組織","たい積組織","層状組織"], ex:"火山岩は急に冷えるため、大きな結晶のまわりを細かい結晶やガラス質が取り囲む斑状組織になります。"},
      {q:"深成岩に見られる、大きさがそろった結晶が組み合わさったつくりを何というか", a:["等粒状組織","斑状組織","たい積組織","縞状組織"], ex:"深成岩はゆっくり冷えるため、大きな結晶が十分に成長してすき間なく組み合わさった等粒状組織になります。"},
      {q:"火山岩と深成岩でつくりにちがいが生じる主な理由は何か", a:["マグマが冷え固まる速さのちがい","マグマの色のちがい","マグマの温度が全く同じだから","ふくまれる水の量が同じだから"], ex:"地表付近で急に冷える火山岩と、地下深くでゆっくり冷える深成岩とでは、冷える速さがちがうためつくりが変わります。"},
      {q:"火山岩の代表的な例として正しいものはどれか", a:["玄武岩","花こう岩","せん緑岩","はんれい岩"], ex:"玄武岩はマグマが地表付近で急に冷えて固まった代表的な火山岩です。"},
      {q:"深成岩の代表的な例として正しいものはどれか", a:["花こう岩","玄武岩","安山岩","りゅうもん岩"], ex:"花こう岩はマグマが地下深くでゆっくり冷えて固まった代表的な深成岩です。"},
      {q:"火成岩をつくる鉱物の結晶が大きく成長しやすいのはどのような場合か", a:["ゆっくり時間をかけて冷え固まる場合","急に冷え固まる場合","水にとける場合","圧力がまったくない場合"], ex:"結晶はゆっくり冷えるほど成長する時間があるため、大きな結晶になりやすいのです。"},
      {q:"地下深くで岩石がとけてできた高温の液体を何というか", a:["マグマ","溶岩","火山灰","軽石"], ex:"地下深くの高い熱によって岩石がとけたものをマグマといいます。"},
      {q:"マグマが地表にふき出したものを何というか", a:["溶岩","マグマだまり","火山ガス","断層"], ex:"マグマが地表に流れ出たもの、またそれが冷えて固まったものを溶岩といいます。"},
      {q:"マグマと溶岩のちがいを正しく説明しているものはどれか", a:["マグマは地下にある状態、溶岩は地表に出た状態のよび方","マグマは液体、溶岩は必ず気体","マグマは固体、溶岩は液体","どちらも同じ意味でちがいはない"], ex:"地下にある高温の液体をマグマ、それが地表にふき出したものを溶岩とよび、区別します。"},
      {q:"火山が噴火するのは主に何が原因か", a:["地下のマグマにふくまれるガスの圧力が高まること","海水が急に冷たくなること","太陽の熱で地面が温められること","川の水が地下にしみこむこと"], ex:"マグマの中の水蒸気などのガスがふくらんで圧力が高まり、それにたえられなくなると噴火が起こります。"},
      {q:"マグマのねばりけが強い火山にできやすい地形の特徴はどれか", a:["ドーム状の盛り上がった形の火山","傾斜がゆるやかで広がった形の火山","まったく高さのない平らな地形","海の中にしかできない地形"], ex:"ねばりけの強いマグマは流れにくいため、盛り上がったドーム状の火山になりやすいです。"},
      {q:"マグマのねばりけが弱い火山の噴火の特徴として正しいものはどれか", a:["比較的おだやかに溶岩が流れ出やすい","激しく爆発的にふん火する","火山が全くできない","必ず津波を起こす"], ex:"ねばりけの弱いマグマはさらさらと流れやすいため、比較的おだやかな噴火になることが多いです。"},
      {q:"火山の噴火によって空高くふき上げられる、細かい岩石のつぶを何というか", a:["火山灰","溶岩ドーム","マグマだまり","断層"], ex:"噴火によって空中に飛び散った細かい岩石のつぶを火山灰といい、遠くまで風で運ばれることがあります。"},
      {q:"火山の噴火が引き起こすことがある災害として適切でないものはどれか", a:["台風の発生","火砕流の発生","火山灰による農作物の被害","溶岩流による建物の被害"], ex:"台風は気象現象であり、火山の噴火とは直接関係ありません。噴火では火砕流や溶岩流、火山灰による被害が起こります。"},
      {q:"地球の表面をおおう、厚い岩の板を何というか", a:["プレート","マグマだまり","断層","地殻変動"], ex:"地球の表面はプレートとよばれるいくつもの厚い岩の板でおおわれています。"},
      {q:"地震の多くは、プレートのどのような動きによって引き起こされるか", a:["プレートどうしがぶつかったり沈みこんだりする動き","プレートがまったく動かないこと","プレートが空気中に浮かぶこと","プレートが太陽の熱でとけること"], ex:"プレートどうしが押し合ったり、一方が他方の下に沈みこんだりするときに大きな力がたまり、地震が起こります。"},
      {q:"地下の岩盤に力が加わり、岩盤がずれて破壊された部分を何というか", a:["断層","震源","しゅう曲","マグマだまり"], ex:"大きな力によって地下の岩盤がずれて破壊された部分を断層といいます。"},
      {q:"地層が波打つように曲がっている状態を何というか", a:["しゅう曲","断層","侵食","風化"], ex:"地層に大きな力が長い間加わり続けると、地層が折れずに波打つように曲がることがあり、これをしゅう曲といいます。"},
      {q:"地震が発生した地下の場所を何というか", a:["震源","震央","断層面","プレート境界"], ex:"地下で実際に地震が発生した場所を震源といいます。"},
      {q:"震源の真上にあたる地表の地点を何というか", a:["震央","震源","断層","火口"], ex:"震源の真上にある地表の地点を震央といいます。"},
      {q:"地震のゆれが地面に伝わる速さの異なる2種類の波のうち、先に伝わる小さいゆれを起こす波を何というか", a:["P波","S波","表面波","津波"], ex:"P波はS波より伝わる速さが速いため、地震のときは先に小さなゆれ(初期微動)として伝わります。"},
      {q:"地震のゆれのうち、P波の後に伝わる大きなゆれを起こす波を何というか", a:["S波","P波","火山波","反射波"], ex:"S波はP波より遅れて伝わり、大きなゆれ(主要動)を引き起こします。"},
      {q:"日本列島付近で地震が多く発生する理由として最も適切なものはどれか", a:["複数のプレートの境界に位置しているから","森林が多いから","一年中雨が多いから","火山が一つもないから"], ex:"日本列島は複数のプレートが集まる境界付近にあるため、プレートの動きによる力がたまりやすく、地震が多く発生します。"},
      {q:"ある場所での地震のゆれの大きさを表す尺度を何というか", a:["震度","マグニチュード","湿度","気圧"], ex:"震度はその場所での実際のゆれの大きさを表す尺度です。"},
      {q:"地震そのものの規模(エネルギーの大きさ)を表す尺度を何というか", a:["マグニチュード","震度","標高","深度"], ex:"マグニチュードは地震が発生させたエネルギーの大きさを表す尺度で、地震そのものの規模を示します。"},
      {q:"日本の気象庁が発表する震度は何段階に分けられているか", a:["10段階","5段階","7段階","100段階"], ex:"気象庁の震度は震度0から震度7までを基本とし、震度5と震度6を強弱に分けるため合計10段階になっています。"},
      {q:"同じ地震でも観測する場所によって震度が異なることがある理由は何か", a:["震源からのきょりや地盤のようすがちがうから","マグニチュードが場所ごとに変わるから","観測する時刻がちがうから","使う時計がちがうから"], ex:"震源からのきょりや、その土地の地盤のかたさ・やわらかさによって伝わるゆれの大きさが変わるため、震度は場所ごとに異なります。"},
      {q:"マグニチュードが1大きくなると、地震のエネルギーはどうなるか", a:["大きく増える","半分になる","変化しない","少しだけ増える"], ex:"マグニチュードが1大きくなるとエネルギーは約32倍になり、2大きくなると約1000倍になります。"},
      {q:"一つの地震について、マグニチュードの値の数はふつういくつ発表されるか", a:["一つ","観測地点の数だけ","震度の数だけ","都道府県の数だけ"], ex:"マグニチュードは地震そのものの規模を表すため、一つの地震に対して基本的に一つの値が発表されます。"},
      {q:"震源から遠い場所であっても、大きな地震では強い震度が観測されることがある理由として考えられるのはどれか", a:["マグニチュードが大きく地盤がゆれやすい場合があるから","震源からのきょりは震度に関係しないから","必ず震度は同じになるから","遠いほど必ずゆれが強くなるから"], ex:"マグニチュードが大きい地震や、ゆれが伝わりやすい地盤の場所では、震源から離れていても強いゆれになることがあります。"},
      {q:"震度とマグニチュードの関係を正しく表しているものはどれか", a:["同じ地震でも震度は場所ごとに異なるがマグニチュードは一つに決まる","震度もマグニチュードも観測地点ごとに変わる","震度は一つに決まるがマグニチュードは場所ごとに異なる","震度とマグニチュードはまったく同じ意味である"], ex:"マグニチュードは地震の規模を表す値で一つに決まりますが、震度は場所によって伝わり方が異なるため観測地点ごとに変わります。"},
      {q:"海底で発生した地震などによって引き起こされる、海水全体の大きな波を何というか", a:["津波","高潮","波浪","満潮"], ex:"海底の地震によって海底が大きく変動すると、その上の海水全体が持ち上げられ、津波となって広がります。"},
      {q:"津波が発生する主な原因として正しいものはどれか", a:["海底で発生した地震による海底の急激な変動","強い風が海面をふくこと","満月による潮の満ち引き","台風による大雨"], ex:"海底で地震が起こり海底が急に上下に動くと、その上の海水全体が押し上げられたり沈んだりして津波が発生します。"},
      {q:"津波の速さについて正しいものはどれか", a:["沖合の深い海では非常に速く伝わる","沖合ではまったく進まない","陸に近づくほど必ず速くなる","常に自転車ほどの速さである"], ex:"津波は水深が深い沖合ほど速く伝わり、飛行機に近い速さになることもあります。"},
      {q:"津波が海岸に近づくとどのように変化することが多いか", a:["波の高さが高くなる","波の高さが低くなる","完全に消えてしまう","色が変化するだけである"], ex:"水深が浅くなると津波の進む速さが遅くなり、後ろの波が追いついて重なるため波の高さが高くなることがあります。"},
      {q:"津波から身を守るための行動として最も適切なものはどれか", a:["できるだけ早く高い場所へ避難する","様子を見るために海岸に近づく","車で海岸沿いを走って確認する","家の中でじっと座って待つ"], ex:"津波は短時間で襲ってくることがあるため、地震を感じたらすぐに高台など安全な場所へ避難することが大切です。"},
      {q:"津波は普通の風による波(波浪)と比べてどのような特徴があるか", a:["海面から海底近くまで巨大なかたまりとして動く","海面近くだけがわずかにゆれる","海底にはまったく影響しない","台風のときにしか発生しない"], ex:"津波は海底から海面までの海水全体が巨大なかたまりとなって動くため、ふつうの波よりはるかに大きなエネルギーを持ちます。"},
      {q:"2011年に東北地方で大きな津波を引き起こした地震の原因として正しいものはどれか", a:["海底のプレートの境界で起こった巨大地震","火山の噴火","台風の接近","満潮による海面上昇"], ex:"東北地方太平洋沖地震は海底のプレート境界で発生した巨大地震で、大規模な津波を引き起こしました。"},
      {q:"津波の被害を減らすための取り組みとして適切なものはどれか", a:["防潮堤の建設や避難訓練の実施","高い建物をすべて取りこわすこと","海岸に近づく人を増やすこと","地震の予知だけにたよること"], ex:"防潮堤などの施設を整備するとともに、日ごろから避難訓練を行っておくことが被害を減らすために大切です。"},
      {q:"流れる水が地面や岩石をけずるはたらきを何というか", a:["侵食","運搬","たい積","風化"], ex:"川の水などが地面や岩石をけずるはたらきを侵食といいます。"},
      {q:"流れる水が土砂を運ぶはたらきを何というか", a:["運搬","侵食","たい積","蒸発"], ex:"川の水が土砂を下流へ運んでいくはたらきを運搬といいます。"},
      {q:"川の流れが急な山あいで見られる、けずられてできた深いV字形の谷を何というか", a:["V字谷","扇状地","三角州","河岸段丘"], ex:"山あいでは川の流れる力が強く侵食が盛んなため、深くけずられたV字形の谷ができやすくなります。"},
      {q:"川が山あいから平地に出るところに、土砂が扇形に積もってできる地形を何というか", a:["扇状地","三角州","V字谷","干潟"], ex:"川の流れが急に緩やかになる山のふもとでは、運ばれてきた土砂が扇形に積もり扇状地ができます。"},
      {q:"川が海や湖に流れこむ河口付近に、細かい土砂が積もってできる平らな地形を何というか", a:["三角州","扇状地","V字谷","台地"], ex:"河口付近では川の流れがゆるやかになり、細かい土砂が積もって平らな三角州ができます。"},
      {q:"川の上流と下流で、川原の石の大きさや形を比べたときの一般的なちがいはどれか", a:["上流のほうが大きく角ばった石が多い","下流のほうが大きく角ばった石が多い","上流も下流も同じ大きさで丸い","石の大きさや形にちがいはない"], ex:"上流は侵食されたばかりの大きく角ばった石が多く、下流に流れるにつれて石はけずられて小さく丸くなっていきます。"},

      {q:"電磁石が磁石の性質を持つのはどんなときか。", a:["コイルに電流が流れている間だけ","いつでも常に","鉄しんを入れたときだけ","電池を近づけたときだけ"], ex:"電磁石は電流が流れている間だけ鉄しんが磁石になり、電流を止めると磁石の性質はなくなります。"},
      {q:"電磁石のコイルの中に入れる鉄しんに、多く使われる金属は何か。", a:["鉄","銅","アルミニウム","金"], ex:"鉄は磁石に引きつけられ、また磁石になりやすい性質があるため、電磁石の鉄しんによく使われます。"},
      {q:"電磁石にクリップ(鉄でできたもの)を近づけると、電流が流れているときどうなるか。", a:["引きつけられる","何も起こらない","はねかえされる","音が鳴る"], ex:"電流が流れている電磁石は磁石になっているため、鉄でできたクリップを引きつけます。"},
      {q:"電磁石のスイッチを切ると、引きつけていたクリップはどうなるか。", a:["落ちる","引きつけられたまま","反対の極にくっつく","音を立てて回る"], ex:"電流を止めると電磁石は磁石の性質を失うため、引きつけていた鉄のクリップは落ちてしまいます。"},
      {q:"永久磁石と電磁石の大きなちがいは何か。", a:["電磁石は電流を流している間だけ磁石になる","永久磁石は電流を流さないと磁石にならない","永久磁石は極を変えられる","電磁石は鉄を引きつけない"], ex:"永久磁石はいつも磁石の性質を持っていますが、電磁石は電流を流している間だけ磁石の性質を持つという違いがあります。"},
      {q:"電磁石の力を強くする方法として正しいものはどれか。", a:["電流を大きくする","電流を小さくする","コイルの巻き数を減らす","鉄しんを抜く"], ex:"コイルに流れる電流を大きくすると、電磁石が鉄を引きつける力(磁力)は強くなります。"},
      {q:"電磁石のコイルの巻き数を増やすと、電磁石の力はどうなるか。", a:["強くなる","弱くなる","変わらない","なくなる"], ex:"電流の大きさが同じでも、コイルの巻き数を増やすほど電磁石の力は強くなります。"},
      {q:"電磁石にかん電池を2こ直列つなぎでつなぐと、1このときと比べて力はどうなるか。", a:["強くなる","弱くなる","変わらない","なくなる"], ex:"かん電池を直列つなぎにすると流れる電流が大きくなるため、電磁石の力も強くなります。"},
      {q:"電磁石の力を調べる実験で、コイルの巻き数以外の条件をそろえるのはなぜか。", a:["巻き数だけのちがいによる結果を正しく比べるため","実験を早く終わらせるため","電池を長持ちさせるため","安全のため"], ex:"調べたい条件(巻き数)以外をそろえておくことで、力の変化が本当に巻き数のちがいによるものだと正しく比べることができます。"},
      {q:"100回巻きのコイルと200回巻きのコイルで、同じ大きさの電流を流したとき、電磁石の力が強いのはどちらか。", a:["200回巻きのコイル","100回巻きのコイル","どちらも同じ","どちらも0になる"], ex:"電流の大きさが同じ場合、コイルの巻き数が多いほうが電磁石の力は強くなります。"},
      {q:"電磁石にたくさんのゼムクリップを引きつけさせたいとき、有効な工夫は何か。", a:["コイルの巻き数を増やし電流を大きくする","コイルの巻き数を減らす","鉄しんを抜いてしまう","電池を並列つなぎにする"], ex:"コイルの巻き数を増やしたり、直列つなぎで電流を大きくしたりすると、より多くのクリップを引きつける強い電磁石になります。"},
      {q:"電磁石の鉄しんをぬいてコイルだけにすると、磁力はどうなるか。", a:["弱くなる","強くなる","変わらない","電磁石ではなくなり無関係な力になる"], ex:"鉄しんは磁力を強める働きをしているため、鉄しんをぬくとコイルだけのときより磁力は弱くなります。"},
      {q:"電磁石に流れる電流の向きを反対にすると、N極とS極はどうなるか。", a:["入れかわる","変わらない","両方ともN極になる","両方ともなくなる"], ex:"電流の向きを反対にすると、電磁石のN極とS極が入れかわります。"},
      {q:"電磁石の極を調べるには、何を使うとよいか。", a:["方位磁針","検流計","温度計","虫めがね"], ex:"方位磁針を電磁石の端に近づけると、針の動き方からN極・S極がどちらかを調べることができます。"},
      {q:"かん電池の向きを反対につなぎかえると、電磁石の極はどうなるか。", a:["入れかわる","変わらない","なくなる","強くなるだけ"], ex:"かん電池の向きを反対にすると回路を流れる電流の向きが反対になるため、電磁石のN極とS極も入れかわります。"},
      {q:"電磁石が永久磁石と似ている点は何か。", a:["N極とS極がある","いつも磁力を持っている","極を変えられない","電気を通す"], ex:"電磁石も永久磁石と同じように、鉄を引きつけるN極とS極を持っています。"},
      {q:"電磁石とちがい、ふつうの棒磁石で簡単にはできないことは何か。", a:["極を自由に入れかえること","鉄を引きつけること","N極とS極を持つこと","方位磁針を動かすこと"], ex:"棒磁石はいつも決まった極を持っていますが、電磁石は電流の向きを変えるだけで簡単に極を入れかえられます。"},
      {q:"モーターの中で電流の向きが周期的に切りかわるのは、何のためか。", a:["電磁石の極を切りかえて回転を続けさせるため","電池を長持ちさせるため","電磁石を強くするため","音を鳴らすため"], ex:"モーターの中では整流子によって電流の向きが周期的に切りかわり、電磁石の極を入れかえることで回転を続けることができます。"},
      {q:"モーターが回転するのは、電磁石と何の力を利用しているか。", a:["磁石(永久磁石)","電池だけの力","熱の力","音の力"], ex:"モーターの中には電磁石と永久磁石があり、たがいに引き合ったり反発したりする力を利用して回転しています。"},
      {q:"モーターの中で電流の向きを切りかえる部品を何というか。", a:["整流子","検流計","コンデンサー","ヒューズ"], ex:"整流子はモーターが回るのに合わせて電流の向きを周期的に切りかえ、電磁石の極を入れかえる働きをしています。"},
      {q:"モーターにつなぐ電池の向きを反対にすると、モーターの回転方向はどうなるか。", a:["反対になる","変わらない","止まる","速くなるだけ"], ex:"電池の向きを反対にすると流れる電流の向きが反対になり、電磁石の極が入れかわるためモーターの回転方向も反対になります。"},
      {q:"モーターに流す電流を大きくすると、回転の速さはどうなるか。", a:["速くなる","おそくなる","変わらない","止まる"], ex:"電流を大きくすると電磁石の力が強くなるため、モーターはより速く回転するようになります。"},
      {q:"手回し発電機のハンドルを回す向きを逆にすると、豆電球や発光ダイオードのようすはどうなるか。", a:["電流の向きが逆になる","明るさが2倍になる","発電できなくなる","豆電球だけ消える"], ex:"ハンドルを逆に回すと発電機から流れる電流の向きも逆になり、LEDでは光ったり消えたりする違いが見られる。"},
      {q:"扇風機やミニカーなど、電気の力で物を動かす仕組みに使われている部品は何か。", a:["モーター","ヒューズ","コンデンサー","発光ダイオード"], ex:"モーターは電気のエネルギーを回転する運動のエネルギーに変える部品で、扇風機やミニカーなどに使われています。"},
      {q:"ハンドルを回すことで電気を作り出す道具を何というか。", a:["手回し発電機","光電池","コンデンサー","検流計"], ex:"手回し発電機はハンドルを回す運動のエネルギーを電気のエネルギーに変える道具です。"},
      {q:"光が当たると電気を作り出す道具を何というか。", a:["光電池(太陽電池)","手回し発電機","コンデンサー","ヒューズ"], ex:"光電池(太陽電池)は光のエネルギーを電気のエネルギーに変える道具で、電卓などにも使われています。"},
      {q:"光電池に当てる光を強くすると、流れる電流はどうなるか。", a:["大きくなる","小さくなる","変わらない","0になる"], ex:"光電池は光が強く当たるほど多くの電気を作り出すため、流れる電流も大きくなります。"},
      {q:"手回し発電機のハンドルを回す向きを反対にすると、電流の向きはどうなるか。", a:["反対になる","変わらない","0になる","大きくなるだけ"], ex:"ハンドルを回す向きを変えると発電機の中の電磁石の動きも変わり、流れる電流の向きが反対になります。"},
      {q:"光電池を使った道具の例として当てはまるものはどれか。", a:["電卓","かん電池","ヒューズ","モーター単体"], ex:"電卓の中には光電池が使われていて、光が当たることで電気を作り、計算機を動かしています。"},
      {q:"手回し発電機と光電池に共通していることは何か。", a:["電気を新しく作り出すことができる","電気をたくわえることができる","光らせることができる部品である","電流を止める働きがある"], ex:"手回し発電機は運動のエネルギー、光電池は光のエネルギーを使って、どちらも電気を新しく作り出すことができます。"},
      {q:"太陽光発電のパネルに使われている部品は何か。", a:["光電池","手回し発電機","コンデンサー","電磁石"], ex:"太陽光発電のパネルには光電池が多数使われていて、太陽の光を電気に変えています。"},
      {q:"電気をたくわえておき、あとで使うことができる部品を何というか。", a:["コンデンサー","発電機","ヒューズ","導線"], ex:"コンデンサーは電気をたくわえておく部品で、たくわえた電気は後で豆電球やモーターに使うことができます。"},
      {q:"手回し発電機で作った電気をコンデンサーにためると、何ができるようになるか。", a:["発電をやめても、たくわえた電気を使うことができる","発電機の力が強くなる","電気の向きが変えられなくなる","光電池が不要になる"], ex:"コンデンサーに電気をたくわえておけば、手回し発電機を回すのをやめたあとでも、たくわえた電気を使って豆電球などを光らせることができます。"},
      {q:"コンデンサーにたくさん電気をためるには、どうすればよいか。", a:["発電機を長い時間、多く回す","発電機を反対向きに回す","導線を外す","光電池を暗い場所に置く"], ex:"発電機を長く、たくさん回すほどコンデンサーに送られる電気の量が増え、多くの電気をたくわえることができます。"},
      {q:"コンデンサーにためた電気で、豆電球とLEDのどちらが長く光り続けるか(同じ量の電気の場合)。", a:["LED","豆電球","どちらも同じ長さ","どちらも光らない"], ex:"LEDは豆電球よりも少ない電気で光るため、同じ量の電気をためたコンデンサーではLEDのほうが長く光り続けます。"},
      {q:"コンデンサーの役割を身近なものにたとえると、次のうちどれに近いか。", a:["電気をためておくタンク","電気を作り出す工場","電気を通さないかべ","音を鳴らすスピーカー"], ex:"コンデンサーは水をためるタンクのように、電気を一度たくわえておいて必要なときに取り出して使うことができる部品です。"},
      {q:"電子オルゴールをコンデンサーにつないで音を鳴らしたあと、しばらくすると音が止まる理由は何か。", a:["たくわえていた電気を使い切ったから","コンデンサーがこわれたから","音の高さが変わったから","導線が不導体になったから"], ex:"コンデンサーにたくわえられる電気の量には限りがあるため、使い続けると電気がなくなり音が止まります。"},
      {q:"電気のエネルギーを光に変える道具の例はどれか。", a:["豆電球","モーター","ブザー","電熱線"], ex:"豆電球は電気のエネルギーを光のエネルギーに変える道具で、フィラメントが熱くなって光を出します。"},
      {q:"電気のエネルギーを音に変える道具の例はどれか。", a:["ブザー","豆電球","アイロン","モーター"], ex:"ブザーは電気のエネルギーを音のエネルギーに変える道具で、警報などにも使われています。"},
      {q:"電気のエネルギーを熱に変える道具の例はどれか。", a:["電熱線を使ったアイロン","モーター","ブザー","光電池"], ex:"電熱線に電流を流すと熱が発生する性質を利用して、アイロンや電気ストーブなどが熱を作り出しています。"},
      {q:"電気のエネルギーを運動(回転)に変える道具の例はどれか。", a:["モーター","豆電球","ブザー","ヒューズ"], ex:"モーターは電気のエネルギーを回転する運動のエネルギーに変える道具で、扇風機などに利用されています。"},
      {q:"ドライヤーの中で、風を起こす部分と熱い風を作る部分にはそれぞれ何が使われているか。", a:["モーターと電熱線","電磁石とコンデンサー","光電池とヒューズ","発電機とLED"], ex:"ドライヤーの中にはモーターがあって風を起こし、電熱線があって空気をあたためており、電気を運動と熱の両方に変えています。"},
      {q:"電気自動車が走るのは、電気のエネルギーを主に何に変えているからか。", a:["運動のエネルギー","光のエネルギー","音のエネルギー","熱のエネルギーだけ"], ex:"電気自動車はモーターを使って、電気のエネルギーをタイヤを回す運動のエネルギーに変えて走っています。"},
      {q:"電気ポットがお湯をわかせるのは、電気を何に変えているからか。", a:["熱のエネルギー","光のエネルギー","音のエネルギー","運動のエネルギー"], ex:"電気ポットの中の電熱線に電流が流れると熱が発生し、その熱で水があたためられてお湯がわきます。"},
      {q:"決まった量より大きい電流が流れると、とけて回路を切るはたらきをする部品は何か。", a:["ヒューズ","コンデンサー","モーター","発光ダイオード"], ex:"ヒューズは決まった量より大きな電流が流れるととけて回路を切り、電気の流れすぎによる火事などを防ぎます。"},
      {q:"家の分電盤にあり、電気の流れすぎを感知して自動でスイッチを切る装置を何というか。", a:["ブレーカー","コンデンサー","光電池","整流子"], ex:"ブレーカーは決められた量より大きな電流が流れたときに自動でスイッチを切り、電気配線が熱くなりすぎて火事になるのを防ぎます。"},
      {q:"たくさんの電化製品を1つのコンセントに同時につなぐと、なぜ危ないのか。", a:["大きな電流が流れすぎて発熱し、火事につながることがあるから","電気が全く流れなくなるから","電化製品が全部光電池に変わるから","電磁石の極が入れかわるから"], ex:"たくさんの電化製品を同時に使うと配線に大きな電流が流れすぎて発熱し、火事の原因になることがあるため注意が必要です。"},
      {q:"ヒューズやブレーカーが切れたとき、まずすべきことは何か。", a:["電流が流れすぎた原因を調べる","すぐにヒューズを太い針金に交換する","電化製品をさらに増やす","何もせずそのまま使い続ける"], ex:"ヒューズやブレーカーが切れたときは、まず電流が流れすぎた原因を確かめて取りのぞくことが安全のために大切です。"},
      {q:"コンセントに水がかかると危ないのはなぜか。", a:["水を通って電気が流れ、感電のおそれがあるから","水が電気を消してしまうから","水がコンセントを冷やしすぎるから","水が電磁石を強くしてしまうから"], ex:"水は電気を通しやすい性質があるため、コンセントに水がかかると電気が水を伝って流れ、感電するおそれがあります。"},
      {q:"電気を安全に使うための工夫として正しいものはどれか。", a:["たこ足配線をさけ、使わない電化製品はコンセントをぬく","コードを束ねたまま高い電流を流す","ぬれた手でコンセントをさわる","コードを家具の下敷きにして使う"], ex:"たこ足配線をさけたり使わないときはコンセントをぬいたりすることで、発熱や火事などの事故を防ぐことができます。"},
      {q:"LEDとは日本語で何とよばれる部品か。", a:["発光ダイオード","検流計","電磁石","光電池"], ex:"LEDは発光ダイオードともよばれ、電気を通すと光る性質を持った部品です。"},
      {q:"LEDは豆電球と比べて、同じ明るさで光らせるとき電気の使用量はどうか。", a:["少ない電気ですむ","たくさんの電気が必要","変わらない","電気は全く必要ない"], ex:"LEDは豆電球よりも少ない電気で同じくらいの明るさを出すことができるため、省エネルギーにつながります。"},
      {q:"LEDに電流を流すとき、気をつけなければならないことは何か。", a:["決まった向きに電流を流さないと光らない","どちら向きでも同じように光る","電流を流さなくても光る","光電池につながないと光らない"], ex:"LEDには決まった電流の向きがあり、逆向きに電流を流しても光らないので、つなぐ向きに注意する必要があります。"},
      {q:"豆電球とLEDで、長持ちしやすいのはどちらか。", a:["LED","豆電球","どちらも同じくらい","どちらもすぐに切れる"], ex:"LEDは豆電球に比べて長い時間使い続けることができ、交換の回数が少なくてすみます。"},
