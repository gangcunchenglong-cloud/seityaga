/* =========================================================
   app.js ―― 画面制御・出題・記録
   ========================================================= */
(function (global) {
  'use strict';

  var ERA_ORDER = [
    'shokubutsu', 'konchu', 'hito', 'tenki', 'tenmon',
    'daichi', 'hikari', 'denki', 'busshitsu', 'rikigaku'
  ];
  var DATA = global.RIKA || {};
  var ERAS = ERA_ORDER.filter(function (id) { return DATA[id]; }).map(function (id) { return DATA[id]; });

  function allQuestions() {
    var out = [];
    ERAS.forEach(function (era) {
      era.questions.forEach(function (q, i) {
        out.push({ q: q, era: era, idx: i, id: era.id + '-' + i });
      });
    });
    return out;
  }
  var ALL = allQuestions();

  function eraById(id) {
    for (var i = 0; i < ERAS.length; i++) if (ERAS[i].id === id) return ERAS[i];
    return null;
  }
  function itemById(id) {
    for (var i = 0; i < ALL.length; i++) if (ALL[i].id === id) return ALL[i];
    return null;
  }

  var KEY = {
    weak: 'rika1000_weak_v1',
    stat: 'rika1000_stat_v1',
    pref: 'rika1000_pref_v1',
    dev:  'rika1000_device_v1'
  };

  function load(key, def) {
    try {
      var s = localStorage.getItem(key);
      return s ? JSON.parse(s) : def;
    } catch (e) { return def; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var weak = load(KEY.weak, {});
  var stat = load(KEY.stat, {});

  /* 保存データは数値・形式を検証してから使う（壊れた値や細工された値をそのまま画面に出さないため） */
  (function normalizeStored() {
    function isPlainObject(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
    if (!isPlainObject(weak)) weak = {};
    if (!isPlainObject(stat)) stat = {};
    Object.keys(weak).forEach(function (k) {
      var w = weak[k];
      if (!w || typeof w !== 'object') { delete weak[k]; return; }
      w.m = Number(w.m) || 0;
      w.s = Number(w.s) || 0;
      w.t = Number(w.t) || 0;
    });
    Object.keys(stat).forEach(function (k) {
      var e = stat[k];
      if (!e || typeof e !== 'object') { delete stat[k]; return; }
      e.ans = Number(e.ans) || 0;
      e.cor = Number(e.cor) || 0;
      e.best = Number(e.best) || 0;
    });
  })();
  var pref = load(KEY.pref, { mode: 'mix', count: 10, gloss: 'on' });
  if (!pref.gloss) pref.gloss = 'on';
  if (!pref.type) pref.type = 'すべて';

  var deviceId = load(KEY.dev, null);
  if (!deviceId) {
    deviceId = 'D-' + Math.random().toString(36).slice(2, 6).toUpperCase() +
               Math.random().toString(36).slice(2, 6).toUpperCase();
    save(KEY.dev, deviceId);
  }

  function weakIds() { return Object.keys(weak); }
  function weakCount() { return weakIds().length; }

  function recordAnswer(item, correct) {
    var id = item.id;
    if (correct) {
      if (weak[id]) {
        weak[id].s = (weak[id].s || 0) + 1;
        weak[id].t = Date.now();
        if (weak[id].s >= 2) delete weak[id];
      }
    } else {
      var w = weak[id] || { m: 0, s: 0 };
      w.m = (w.m || 0) + 1;
      w.s = 0;
      w.t = Date.now();
      weak[id] = w;
    }
    var e = stat[item.era.id] || { ans: 0, cor: 0, best: 0 };
    e.ans++; if (correct) e.cor++;
    stat[item.era.id] = e;
    save(KEY.weak, weak);
    save(KEY.stat, stat);
  }

  function recordBest(eraId, pct) {
    var e = stat[eraId] || { ans: 0, cor: 0, best: 0 };
    if (pct > (e.best || 0)) e.best = pct;
    stat[eraId] = e;
    save(KEY.stat, stat);
  }

  var $ = function (sel) { return document.querySelector(sel); };
  var app = document.getElementById('app');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var GLOSS = window.YOUGO || {};
  var glossRe = null;
  (function buildGlossRegex() {
    var keys = Object.keys(GLOSS);
    if (!keys.length) return;
    keys.sort(function (a, b) { return b.length - a.length; });
    var esc2 = keys.map(function (k) {
      return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    });
    glossRe = new RegExp('(' + esc2.join('|') + ')', 'g');
  })();

  function gloss(text, mode, avoid) {
    var html = esc(text);
    if (!glossRe || mode === 'off') return html;
    var seen = {};
    return html.replace(glossRe, function (m, _g, offset, whole) {
      if (seen[m]) return m;
      if (whole.charAt(offset + m.length) === '（') return m;
      if (avoid && (m === avoid || GLOSS[m].indexOf(avoid) >= 0)) return m;
      seen[m] = true;
      if (mode === 'tap') {
        return '<span class="term" data-t="' + esc(m) + '" onclick="Q.term(this)">' + m + '</span>';
      }
      return '<span class="term">' + m +
             '<span class="term-inline">（' + esc(GLOSS[m]) + '）</span></span>';
    });
  }

  function collectTerms(texts) {
    if (!glossRe) return [];
    var found = [], seen = {};
    texts.forEach(function (t) {
      if (!t) return;
      String(t).replace(glossRe, function (m) {
        if (!seen[m]) { seen[m] = true; found.push(m); }
        return m;
      });
    });
    return found;
  }

  function termListHtml(texts) {
    var terms = collectTerms(texts);
    if (!terms.length) return '';
    return '<div class="fb-terms">' +
      '<span class="fb-label">ことばの意味</span>' +
      terms.map(function (t) {
        return '<div class="fb-term"><b>' + esc(t) + '</b>（' + esc(GLOSS[t]) + '）</div>';
      }).join('') +
    '</div>';
  }

  function showTerm(el) {
    var t = el.getAttribute('data-t');
    if (GLOSS[t]) toast(t + '　＝　' + GLOSS[t]);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function setTab(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('active', b.dataset.tab === name);
    });
  }
  function updateBadge() {
    var b = document.getElementById('tabBadge');
    var n = weakCount();
    b.textContent = n;
    b.classList.toggle('zero', n === 0);
  }

  /* ---------- 画面：ホーム ---------- */
  function viewHome() {
    setTab('home');
    var totalQ = ALL.length;
    var totalAns = 0, totalCor = 0;
    ERAS.forEach(function (e) {
      var s = stat[e.id]; if (s) { totalAns += s.ans; totalCor += s.cor; }
    });
    var rate = totalAns ? Math.round(totalCor / totalAns * 100) : 0;

    var cards = ERAS.map(function (era) {
      var s = stat[era.id] || { ans: 0, cor: 0, best: 0 };
      var acc = s.ans ? Math.round(s.cor / s.ans * 100) : 0;
      var wk = weakIds().filter(function (id) { return id.indexOf(era.id + '-') === 0; }).length;
      return '' +
      '<button class="era-card" style="--era-color:' + era.color + '" onclick="Q.setup(\'era\',\'' + era.id + '\')">' +
        '<div class="era-no">' + esc(era.no) + '</div>' +
        '<h3>' + esc(era.name) + '</h3>' +
        '<div class="era-period">' + esc(era.period) + '</div>' +
        '<div class="era-themes">' + esc(era.themes) + '</div>' +
        '<div class="era-progress"><div style="width:' + acc + '%"></div></div>' +
        '<div class="era-meta">' +
          '<span class="era-count">全' + era.questions.length + '問</span>' +
          '<span>' + (s.ans ? '正答率 ' + acc + '％' : 'まだ挑戦していません') + '</span>' +
        '</div>' +
        (wk ? '<div class="era-weak">苦手 ' + wk + '問</div>' : '') +
      '</button>';
    }).join('');

    app.innerHTML = '' +
    '<section class="hero">' +
      '<h2>単元を選んで、10問ずつ。</h2>' +
      '<p>各単元20問以上・全' + totalQ + '問から毎回ランダムに出題します。4択と記述の両方に対応し、記述は書き方のゆれも読み取って添削します。</p>' +
      '<div class="hero-badges">' +
        '<span class="badge">収録 <b>' + totalQ + '</b> 問</span>' +
        '<span class="badge">単元 <b>' + ERAS.length + '</b> 区分</span>' +
        '<span class="badge">通算正答率 <b>' + rate + '</b>％</span>' +
      '</div>' +
    '</section>' +

    '<div class="quick-row">' +
      '<button class="quick-card quick-all" onclick="Q.setup(\'all\')">' +
        '<div><h3>全単元ランダム10問</h3><p>単元をまたいで出題。実戦形式の総合演習。</p></div>' +
        '<span class="quick-go">はじめる</span>' +
      '</button>' +
      '<button class="quick-card quick-weak' + (weakCount() ? '' : ' disabled') + '" onclick="Q.setup(\'weak\')">' +
        '<div><h3>苦手克服 <span id="weakNum">' + weakCount() + '</span>問</h3>' +
        '<p>' + (weakCount() ? 'まちがえた問題だけを出し直します。' : 'まちがえた問題がここにたまります。') + '</p></div>' +
        '<span class="quick-go">' + (weakCount() ? '復習する' : '—') + '</span>' +
      '</button>' +
    '</div>' +

    '<div class="section-label">単元から選ぶ</div>' +
    '<div class="era-grid">' + cards + '</div>' +

    '<div class="danger-zone">' +
      '<button class="btn btn-ghost" onclick="Q.resetAll()">全データをリセット（苦手・記録をすべて消去）</button>' +
    '</div>';
    updateBadge();
  }

  /* ---------- 画面：出題設定 ---------- */
  var setupCtx = null;
  var TYPES = ['すべて', 'しくみ', '計算', '観察'];

  function typeOf(q) { return q.t || '一問一答'; }
  function matchType(item) {
    return pref.type === 'すべて' || typeOf(item.q) === pref.type;
  }
  function typeLabel() {
    return pref.type === 'すべて' ? '' : '「' + pref.type + '」の';
  }

  function poolFor(kind, eraId) {
    var base;
    if (kind === 'all') base = ALL;
    else if (kind === 'weak') base = weakIds().map(itemById).filter(Boolean);
    else base = ALL.filter(function (it) { return it.era.id === eraId; });
    return base.filter(matchType);
  }

  function typePill(val) {
    var n = poolFor(setupCtx.kind, setupCtx.eraId).length;
    var save0 = pref.type;
    pref.type = val;
    var cnt = poolFor(setupCtx.kind, setupCtx.eraId).length;
    pref.type = save0;
    return '<button class="choice-pill type-pill' + (pref.type === val ? ' active' : '') +
           (cnt === 0 ? ' empty' : '') +
           '" data-type="' + val + '" onclick="Q.pickType(\'' + val + '\')">' +
           val + '<small>' + cnt + '問</small></button>';
  }

  function pickType(t) {
    pref.type = t; save(KEY.pref, pref);
    setup(setupCtx.kind, setupCtx.eraId);
  }

  function setup(kind, eraId) {
    if (kind === 'weak' && weakCount() === 0) { toast('まだ苦手な問題はありません'); return; }
    setupCtx = { kind: kind, eraId: eraId || null };

    var pool = poolFor(kind, eraId);
    var poolSize = pool.length;
    var title, sub;
    if (kind === 'all') {
      title = '全単元ランダム';
      sub = typeLabel() + '全' + poolSize + '問からランダムに出題します。';
    } else if (kind === 'weak') {
      title = '苦手克服';
      sub = 'まちがえた' + weakCount() + '問のうち、' + typeLabel() + poolSize +
            '問から出題します。2回続けて正解すると卒業です。';
    } else {
      var era = eraById(eraId);
      title = era.name;
      sub = era.period + '　' + typeLabel() + '全' + poolSize + '問からランダムに出題します。';
    }
    if (poolSize === 0) {
      sub = 'この組み合わせに当てはまる問題がありません。出題タイプを変えてください。';
    }

    var counts = [5, 10, 15, 20, 30].filter(function (n, i, arr) {
      return n <= poolSize || i === 0 || arr[i - 1] < poolSize;
    });
    if (!counts.length) counts = [5];
    var activeCount = counts.indexOf(pref.count) >= 0 ? pref.count : counts[counts.length - 1];

    app.innerHTML = '' +
    '<div class="setup-box">' +
      '<div class="back-link" onclick="Q.go(\'home\')">← もどる</div>' +
      '<h2 class="setup-title">' + esc(title) + '</h2>' +
      '<p class="setup-sub">' + esc(sub) + '</p>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">出題タイプ</div>' +
        '<div class="choice-row type-row">' + TYPES.map(typePill).join('') + '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">解答の形式</div>' +
        '<div class="choice-row">' +
          modePill('choice', '4択', '選択肢から選ぶ') +
          modePill('write', '記述', 'キーボードで書く') +
          modePill('mix', 'ミックス', '4択と記述が交ざる') +
        '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">むずかしい語の意味</div>' +
        '<div class="choice-row">' +
          glossPill('on', '文中に出す', '語のあとに（意味）') +
          glossPill('tap', 'タップで見る', '語を押すと意味が出る') +
          glossPill('off', 'つけない', '本番と同じ形で解く') +
        '</div>' +
      '</div>' +

      '<div class="setup-group">' +
        '<div class="setup-group-label">問題数</div>' +
        '<div class="choice-row">' +
          counts.map(function (n) {
            return '<button class="choice-pill' + (activeCount === n ? ' active' : '') +
                   '" data-count="' + n + '" onclick="Q.pickCount(' + n + ')">' + n + '問</button>';
          }).join('') +
        '</div>' +
      '</div>' +

      '<div class="setup-actions">' +
        '<button class="btn btn-primary" onclick="Q.start()">スタート</button>' +
      '</div>' +
    '</div>';
  }

  function modePill(val, label, note) {
    return '<button class="choice-pill' + (pref.mode === val ? ' active' : '') +
           '" data-mode="' + val + '" onclick="Q.pickMode(\'' + val + '\')">' +
           label + '<small>' + note + '</small></button>';
  }
  function glossPill(val, label, note) {
    return '<button class="choice-pill' + (pref.gloss === val ? ' active' : '') +
           '" data-gloss="' + val + '" onclick="Q.pickGloss(\'' + val + '\')">' +
           label + '<small>' + note + '</small></button>';
  }
  function pickGloss(g) {
    pref.gloss = g; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-gloss]'), function (b) {
      b.classList.toggle('active', b.dataset.gloss === g);
    });
  }
  function pickMode(m) {
    pref.mode = m; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('active', b.dataset.mode === m);
    });
  }
  function pickCount(n) {
    pref.count = n; save(KEY.pref, pref);
    Array.prototype.forEach.call(document.querySelectorAll('[data-count]'), function (b) {
      b.classList.toggle('active', Number(b.dataset.count) === n);
    });
  }

  /* ---------- 出題 ---------- */
  var session = null;

  function start() {
    var pool = poolFor(setupCtx.kind, setupCtx.eraId);
    if (!pool.length) { toast('出題できる問題がありません'); go('home'); return; }

    var picked = shuffle(pool).slice(0, Math.min(pref.count, pool.length));
    session = {
      kind: setupCtx.kind,
      eraId: setupCtx.eraId,
      list: picked.map(function (it) {
        var m = pref.mode === 'mix' ? (Math.random() < 0.5 ? 'choice' : 'write') : pref.mode;
        return { item: it, mode: m, order: shuffle([0, 1, 2, 3]), result: null };
      }),
      i: 0, score: 0, points: 0, log: []
    };
    renderQuestion();
  }

  function renderQuestion() {
    setTab(null);
    var s = session, cur = s.list[s.i], it = cur.item, q = it.q;
    var pct = Math.round(s.i / s.list.length * 100);

    var body;
    if (cur.mode === 'choice') {
      body = '<div class="choices" id="choices">' +
        cur.order.map(function (oi, n) {
          return '<button class="choice-btn" data-oi="' + oi + '" onclick="Q.answerChoice(' + oi + ')">' +
                 '<span class="choice-letter">' + (n + 1) + '</span>' +
                 '<span>' + esc(q.a[oi]) + '</span></button>';
        }).join('') +
      '</div>';
    } else {
      body = '<div class="answer-input-row">' +
        '<input class="answer-input" id="ansInput" type="text" autocomplete="off" ' +
        'placeholder="答えを書いてください" onkeydown="Q.inputKey(event)">' +
        '<button class="btn btn-primary" id="submitBtn" onclick="Q.answerWrite()">採点</button>' +
      '</div>' +
      '<div class="write-hint">漢字で書くのが理想ですが、ひらがなでも判定します。</div>';
    }

    app.innerHTML = '' +
    '<div class="quiz-wrap">' +
      '<div class="quiz-top">' +
        '<span>' + (s.i + 1) + ' / ' + s.list.length + '問</span>' +
        '<span class="quiz-score">正解 ' + s.score + '</span>' +
      '</div>' +
      '<div class="progress-bar"><div style="width:' + pct + '%"></div></div>' +
      '<div class="qcard">' +
        '<div class="qcard-head">' +
          '<span class="era-tag" style="--era-color:' + it.era.color + '">' + esc(it.era.short) + '</span>' +
          '<span class="mode-tag ' + cur.mode + '">' + (cur.mode === 'choice' ? '4択' : '記述') + '</span>' +
          (typeOf(q) !== '一問一答'
            ? '<span class="type-tag">' + esc(typeOf(q)) + '</span>' : '') +
        '</div>' +
        '<p class="qtext">' + gloss(q.q, pref.gloss, q.a[0]) + '</p>' +
        body +
        '<div class="feedback" id="feedback"></div>' +
        '<div class="quiz-actions" id="quizActions">' +
          '<button class="btn btn-ghost" onclick="Q.quit()">やめる</button>' +
        '</div>' +
      '</div>' +
    '</div>';

    if (cur.mode === 'write') {
      var el = document.getElementById('ansInput');
      if (el) el.focus();
    }
  }

  function answerChoice(oi) {
    var cur = session.list[session.i];
    if (cur.result) return;
    var q = cur.item.q;
    var correct = (oi === 0);
    var btns = document.querySelectorAll('.choice-btn');
    Array.prototype.forEach.call(btns, function (b) {
      var bi = Number(b.dataset.oi);
      b.classList.add('locked');
      if (bi === 0) b.classList.add('correct');
      else if (bi === oi) b.classList.add('wrong');
      else b.classList.add('dim');
      b.onclick = null;
    });

    var isTerm = q.a[0].length <= 12 && !/(ため|こと|から|ように|なった|られた)$/.test(q.a[0]);
    var comment, advice;
    if (correct) {
      comment = '正解です。';
      advice = isTerm
        ? '選べただけで満足せず、記述モードでも書けるか試してみましょう。'
        : '選べただけで満足せず、なぜそうなるのかを自分の言葉で説明してみましょう。';
    } else {
      comment = '不正解。あなたが選んだ「' + q.a[oi] + '」ではなく、正解は「' + q.a[0] + '」です。';
      advice = isTerm
        ? '「' + q.a[oi] + '」がどんな場面で出てくる言葉かを調べておくと、次から迷わなくなります。'
        : '選んだ選択肢のどこがちがっていたのかを、解説と見くらべて確かめておきましょう。';
    }
    finish(correct, correct ? 1 : 0, comment, advice, null);
  }

  function answerWrite() {
    var cur = session.list[session.i];
    if (cur.result) return;
    var el = document.getElementById('ansInput');
    var raw = el ? el.value : '';
    var g = Grader.grade(raw, cur.item.q);

    if (el) {
      el.classList.add(g.ok ? 'correct' : 'wrong');
      el.readOnly = true;
    }
    var sb = document.getElementById('submitBtn');
    if (sb) { sb.disabled = true; sb.textContent = '採点ずみ'; }

    finish(g.ok, g.score, g.comment, g.advice, raw);
  }

  function finish(correct, points, comment, advice, userAnswer) {
    var s = session, cur = s.list[s.i], q = cur.item.q;
    cur.result = { correct: correct, points: points, user: userAnswer };
    if (correct) s.score++;
    s.points += points;
    recordAnswer(cur.item, correct);
    s.log.push({ item: cur.item, correct: correct, user: userAnswer, mode: cur.mode, comment: comment });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (correct ? 'good' : 'bad');
    fb.innerHTML = '' +
      '<div class="fb-head">' + (correct ? '○ 正解' : '× 不正解') + '</div>' +
      (userAnswer !== null && userAnswer !== undefined && userAnswer !== ''
        ? '<div class="fb-yours">あなたの答え：<b>' + esc(userAnswer) + '</b></div>' : '') +
      '<div class="fb-answer">模範解答：' + esc(q.a[0]) + '</div>' +
      '<div class="fb-block"><span class="fb-label">添削</span>' + esc(comment) + '</div>' +
      (advice ? '<div class="fb-block"><span class="fb-label">アドバイス</span>' + esc(advice) + '</div>' : '') +
      '<div class="fb-block"><span class="fb-label">解説</span>' + esc(q.ex) + '</div>' +
      termListHtml([q.q, q.ex].concat(q.a));

    var last = (s.i === s.list.length - 1);
    document.getElementById('quizActions').innerHTML =
      '<button class="btn btn-ghost" onclick="Q.quit()">やめる</button>' +
      '<button class="btn btn-primary" id="nextBtn" onclick="Q.next()">' +
      (last ? '結果を見る' : '次の問題へ') + '</button>';
    var nb = document.getElementById('nextBtn');
    if (nb) nb.focus();
    updateBadge();
  }

  function next() {
    if (session.i < session.list.length - 1) { session.i++; renderQuestion(); }
    else viewResult();
  }
  function quit() {
    if (confirm('このセットをやめて、学習画面にもどりますか？（ここまでの記録は保存されています）')) go('home');
  }
  function inputKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var cur = session.list[session.i];
      if (cur.result) next(); else answerWrite();
    }
  }

  /* ---------- 画面：結果 ---------- */
  function viewResult() {
    var s = session;
    var total = s.list.length;
    var pct = Math.round(s.score / total * 100);
    if (s.kind === 'era') recordBest(s.eraId, pct);

    var title, sub;
    if (pct === 100) { title = '全問正解'; sub = '完璧です。次は記述モードや、ほかの単元に進みましょう。'; }
    else if (pct >= 80) { title = 'よくできました'; sub = '合格ラインです。まちがえた問題は「苦手」に入っています。'; }
    else if (pct >= 50) { title = 'もう一歩'; sub = '解説を読み直してから、同じ単元をもう一度回してみましょう。'; }
    else { title = 'ここが伸びしろ'; sub = 'まずは解説を読むところから。苦手タブで復習できます。'; }

    var wrongs = s.log.filter(function (l) { return !l.correct; });
    var wrongHtml = wrongs.length
      ? '<div class="wrong-list">' +
          '<div class="wl-head">まちがえた問題（' + wrongs.length + '問）― 苦手に登録しました</div>' +
          wrongs.map(function (l) {
            return '<div class="wrong-item">' +
              '<div class="wq"><span class="wl-era" style="--era-color:' + l.item.era.color + '">' +
                esc(l.item.era.short) + '</span>' + esc(l.item.q.q) + '</div>' +
              '<div class="wa">' +
                (l.user ? '<span class="mine">' + esc(l.user) + '</span>' : '') +
                '正解：<b>' + esc(l.item.q.a[0]) + '</b></div>' +
              '<div class="wex">' + esc(l.item.q.ex) + '</div>' +
            '</div>';
          }).join('') +
        '</div>'
      : '<div class="all-correct">まちがえた問題はありません。</div>';

    setTab(null);
    app.innerHTML = '' +
    '<div class="result-box">' +
      '<div class="result-ring" style="--pct:' + pct + '">' +
        '<div class="ring-num">' + s.score + '<small>／' + total + '問</small></div>' +
      '</div>' +
      '<h2 class="result-title">' + title + '</h2>' +
      '<p class="result-sub">' + sub + '　正答率' + pct + '％</p>' +
      '<div class="result-actions">' +
        '<button class="btn btn-primary" onclick="Q.retry()">もう一度10問</button>' +
        (weakCount() ? '<button class="btn btn-gold" onclick="Q.setup(\'weak\')">苦手を復習（' + weakCount() + '問）</button>' : '') +
        '<button class="btn btn-ghost" onclick="Q.go(\'home\')">学習トップへ</button>' +
      '</div>' +
      wrongHtml +
    '</div>';
    updateBadge();
  }

  function retry() {
    setupCtx = { kind: session.kind, eraId: session.eraId };
    start();
  }

  /* ---------- 画面：苦手 ---------- */
  function viewReview() {
    setTab('review');
    var ids = weakIds().sort(function (a, b) { return (weak[b].m || 0) - (weak[a].m || 0); });
    if (!ids.length) {
      app.innerHTML =
        '<div class="setup-box"><h2 class="setup-title">苦手リスト</h2>' +
        '<p class="setup-sub">まだ登録はありません。問題をまちがえると、ここに自動でたまっていきます。</p>' +
        '<div class="empty-note">2回続けて正解すると、そのままリストから消えます。<br>記録はこの端末のブラウザにだけ残るので、タブを閉じても消えません。</div>' +
        '<div class="setup-actions"><button class="btn btn-primary" onclick="Q.go(\'home\')">学習をはじめる</button></div></div>';
      return;
    }

    var byEra = {};
    ids.forEach(function (id) {
      var it = itemById(id); if (!it) return;
      (byEra[it.era.id] = byEra[it.era.id] || []).push({ id: id, it: it, w: weak[id] });
    });

    var groups = ERAS.filter(function (e) { return byEra[e.id]; }).map(function (era) {
      var list = byEra[era.id];
      return '<div class="weak-group">' +
        '<div class="weak-group-head" style="--era-color:' + era.color + '">' +
          '<span>' + esc(era.name) + '</span><span class="wg-count">' + list.length + '問</span>' +
        '</div>' +
        list.map(function (r) {
          return '<div class="weak-item">' +
            '<div class="wi-q">' + esc(r.it.q.q) + '</div>' +
            '<div class="wi-a">正解：<b>' + esc(r.it.q.a[0]) + '</b>' +
              '<span class="wi-miss">×' + (r.w.m || 1) + '回</span>' +
              (r.w.s ? '<span class="wi-streak">あと' + (2 - r.w.s) + '回正解で卒業</span>' : '') +
            '</div>' +
            '<button class="wi-del" data-id="' + esc(r.id) + '" onclick="Q.dropWeak(this.dataset.id)">削除</button>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');

    app.innerHTML = '' +
    '<div class="review-wrap">' +
      '<div class="review-head">' +
        '<div><h2 class="setup-title">苦手リスト <span class="rh-num">' + ids.length + '問</span></h2>' +
        '<p class="setup-sub">2回続けて正解すると自動で卒業します。</p></div>' +
        '<button class="btn btn-gold" onclick="Q.setup(\'weak\')">まとめて復習</button>' +
      '</div>' + groups +
    '</div>';
  }

  function dropWeak(id) {
    delete weak[id]; save(KEY.weak, weak);
    toast('苦手リストから削除しました');
    viewReview(); updateBadge();
  }

  /* ---------- 画面：記録 ---------- */
  function viewRecord() {
    setTab('record');
    var totalAns = 0, totalCor = 0;
    ERAS.forEach(function (e) { var s = stat[e.id]; if (s) { totalAns += s.ans; totalCor += s.cor; } });
    var rate = totalAns ? Math.round(totalCor / totalAns * 100) : 0;

    var rows = ERAS.map(function (era) {
      var s = stat[era.id] || { ans: 0, cor: 0, best: 0 };
      var acc = s.ans ? Math.round(s.cor / s.ans * 100) : 0;
      var wk = weakIds().filter(function (id) { return id.indexOf(era.id + '-') === 0; }).length;
      return '<tr>' +
        '<td><span class="rec-dot" style="background:' + era.color + '"></span>' + esc(era.name) + '</td>' +
        '<td class="num">' + s.ans + '</td>' +
        '<td class="num">' + (s.ans ? acc + '％' : '—') + '</td>' +
        '<td class="num">' + (s.best ? s.best + '％' : '—') + '</td>' +
        '<td class="num' + (wk ? ' warn' : '') + '">' + wk + '</td>' +
      '</tr>';
    }).join('');

    app.innerHTML = '' +
    '<div class="record-wrap">' +
      '<h2 class="setup-title">学習の記録</h2>' +
      '<p class="setup-sub">この端末（' + esc(deviceId) + '）のブラウザに保存されています。ほかの端末とは別の記録になります。</p>' +
      '<div class="rec-summary">' +
        '<div class="rec-card"><span>のべ解答数</span><b>' + totalAns + '</b></div>' +
        '<div class="rec-card"><span>通算正答率</span><b>' + rate + '％</b></div>' +
        '<div class="rec-card"><span>苦手の数</span><b>' + weakCount() + '</b></div>' +
      '</div>' +
      '<table class="rec-table">' +
        '<thead><tr><th>単元</th><th class="num">解答</th><th class="num">正答率</th><th class="num">最高</th><th class="num">苦手</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div class="danger-zone">' +
        '<button class="btn btn-ghost" onclick="Q.resetAll()">記録をすべて消去</button>' +
      '</div>' +
    '</div>';
  }

  function resetAll() {
    if (!confirm('苦手リストと学習記録をすべて消去します。もとにもどせません。よろしいですか？')) return;
    weak = {}; stat = {};
    save(KEY.weak, weak); save(KEY.stat, stat);
    toast('記録を消去しました');
    go('home');
  }

  /* ---------- ルーティング ---------- */
  function go(name) {
    window.scrollTo(0, 0);
    if (name === 'home') viewHome();
    else if (name === 'review') viewReview();
    else if (name === 'record') viewRecord();
    updateBadge();
  }

  document.addEventListener('keydown', function (e) {
    if (!session || !document.querySelector('.qcard')) return;
    var cur = session.list[session.i];
    if (!cur) return;
    if (cur.mode === 'choice' && !cur.result && e.key >= '1' && e.key <= '4') {
      var btns = document.querySelectorAll('.choice-btn');
      var b = btns[Number(e.key) - 1];
      if (b) b.click();
    } else if (cur.result && e.key === 'Enter' && document.activeElement.tagName !== 'INPUT') {
      next();
    }
  });

  global.Q = {
    go: go, setup: setup, start: start, retry: retry, quit: quit, next: next,
    pickMode: pickMode, pickCount: pickCount, pickGloss: pickGloss, pickType: pickType, term: showTerm,
    answerChoice: answerChoice, answerWrite: answerWrite, inputKey: inputKey,
    dropWeak: dropWeak, resetAll: resetAll
  };

  go('home');
})(window);
</script>
</body>
</html>
