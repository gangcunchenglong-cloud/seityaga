<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URLビューア</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bar: #ffffff;
    --border: #d0d4da;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --frame-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --bar: #1f2228;
      --border: #3a3f47;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --frame-bg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  form { display: flex; flex: 1; gap: 8px; min-width: 0; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 8px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bar);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .notice {
    display: none;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .notice.show { display: block; }
  .notice a { color: var(--accent); }
  main { position: relative; flex: 1; min-height: 0; }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--frame-bg);
    display: block;
  }
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    text-align: center;
    padding: 16px;
  }
  .empty h1 { margin: 0; font-size: 20px; color: var(--text); }
  .empty p { margin: 0; font-size: 14px; max-width: 520px; line-height: 1.6; }
  @media (max-width: 560px) {
    header { flex-wrap: wrap; }
    form { order: 3; flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <button id="back" title="戻る" disabled>←</button>
  <button id="forward" title="進む" disabled>→</button>
  <button id="reload" title="再読み込み" disabled>⟳</button>
  <form id="form">
    <input id="url" type="text" placeholder="URLを入力(例: example.com)" autocomplete="off" autofocus>
    <button class="primary" type="submit">開く</button>
  </form>
  <button id="newtab" title="新しいタブで開く" disabled>↗</button>
</header>

<div class="notice" id="notice">
  表示されない場合は、そのサイトが他サイト内への埋め込みを禁止しています(X-Frame-Options / CSP)。
  <a href="#" id="noticeLink" target="_blank" rel="noopener">新しいタブで開く</a>
</div>

<main>
  <div class="empty" id="empty">
    <h1>URLビューア</h1>
    <p>上の欄にURLを入力して「開く」を押すと、このページの中にそのサイトが表示されます。</p>
  </div>
  <iframe id="frame" title="表示中のサイト" hidden
    referrerpolicy="no-referrer-when-downgrade"
    allow="fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media; picture-in-picture"></iframe>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), input = $('url'), empty = $('empty');
  const notice = $('notice'), noticeLink = $('noticeLink');
  const btnBack = $('back'), btnForward = $('forward'), btnReload = $('reload'), btnNewtab = $('newtab');

  // 自前の履歴(iframe内の遷移は別オリジンのため取得できないので、入力したURLのみ管理)
  const history = [];
  let index = -1;

  function normalize(raw) {
    let s = raw.trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) {
      // スペースを含む・ドットが無い場合は検索として扱う
      if (/\s/.test(s) || !/\./.test(s)) {
        return 'https://www.bing.com/search?q=' + encodeURIComponent(s);
      }
      s = 'https://' + s;
    }
    try {
      const u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      return u.href;
    } catch { return null; }
  }

  function show(url) {
    input.value = url;
    empty.hidden = true;
    frame.hidden = false;
    frame.src = url;
    noticeLink.href = url;
    notice.classList.add('show');
    updateButtons();
  }

  function navigate(url) {
    history.splice(index + 1);
    history.push(url);
    index = history.length - 1;
    show(url);
  }

  function updateButtons() {
    btnBack.disabled = index <= 0;
    btnForward.disabled = index >= history.length - 1;
    btnReload.disabled = btnNewtab.disabled = index < 0;
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const url = normalize(input.value);
    if (!url) { alert('有効なURL(http / https)を入力してください。'); return; }
    navigate(url);
  });
  btnBack.onclick = () => { if (index > 0) show(history[--index]); };
  btnForward.onclick = () => { if (index < history.length - 1) show(history[++index]); };
  btnReload.onclick = () => { if (index >= 0) { frame.src = 'about:blank'; setTimeout(() => frame.src = history[index], 0); } };
  btnNewtab.onclick = () => { if (index >= 0) window.open(history[index], '_blank', 'noopener'); };

  // ?url=... 付きで開いた場合はそのURLを表示
  const initial = new URLSearchParams(location.search).get('url');
  if (initial) { const u = normalize(initial); if (u) navigate(u); }
</script>
</body>
</html>
